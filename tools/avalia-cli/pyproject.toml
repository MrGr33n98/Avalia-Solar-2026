[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-avalia"
version = "0.1.0"
description = "Agent-Native CLI harness for Avalia Solar 2026 Founder & Backoffice Operations (CLI-Anything pattern)"
readme = "cli_anything/avalia/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Avalia Solar Engineering", email = "engenharia@avaliasolar.com.br"},
]
keywords = ["avalia-solar", "cli", "cli-anything", "ai-agent", "solar", "backoffice"]
dependencies = [
    "click>=8.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
cli-anything-avalia = "cli_anything.avalia.avalia_cli:main"
avalia = "cli_anything.avalia.avalia_cli:main"

[tool.setuptools.packages.find]
include = ["cli_anything.*"]

[tool.setuptools.package-data]
"cli_anything.avalia" = ["skills/*.md", "README.md"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests running the installed CLI subprocess",
]
testpaths = ["cli_anything/avalia/tests"]
