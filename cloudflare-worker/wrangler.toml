name = "avaliasolar-edge-titan"
main = "src/index.js"
compatibility_date = "2024-01-01"

# SRE: Smart Placement melhora a latência conectando o worker mais perto do backend
[placement]
mode = "smart"

[vars]
BACKEND_URL = "https://api.avaliasolar.com.br"
ENVIRONMENT = "production"

# Configurações de Ambiente
[env.staging]
name = "avaliasolar-edge-staging"
[env.staging.vars]
BACKEND_URL = "https://staging-api.avaliasolar.com.br"
ENVIRONMENT = "staging"

[env.dev]
name = "avaliasolar-edge-dev"
[env.dev.vars]
BACKEND_URL = "http://localhost:3000"
ENVIRONMENT = "development"

# INSTRUÇÕES DE SEGURANÇA:
# O SHARED_SECRET NUNCA deve ser colocado aqui.
# Execute: npx wrangler secret put SHARED_SECRET
