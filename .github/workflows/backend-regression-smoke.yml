name: Backend Regression Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-back/**'
      - '.github/workflows/backend-regression-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'AB0-1-back/**'
      - '.github/workflows/backend-regression-smoke.yml'

concurrency:
  group: backend-regression-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.9'
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libvips42

      - name: Prepare test database
        run: bundle exec rails db:prepare

      - name: Validate critical routes
        run: |
          bundle exec rails routes -g sector_ratings
          bundle exec rails routes -g company_dashboard

      - name: Run targeted regression suite
        run: |
          bundle exec rspec \
            spec/models/company_plan_features_spec.rb \
            spec/models/company_sector_question_spec.rb \
            spec/policies/company_policy_spec.rb \
            spec/services/analytics/track_event_service_spec.rb \
            spec/requests/api/v1/company_sector_questions_spec.rb \
            spec/requests/api/v1/sector_ratings_spec.rb \
            spec/requests/api/v1/company_dashboard_stats_notifications_spec.rb

