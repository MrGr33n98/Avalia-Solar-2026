name: Mobile CD (EAS Build & Update)

on:
  push:
    branches: [ main ]
    paths:
      - 'AB0-1-mobile/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose EAS Action'
        required: true
        default: 'update'
        type: choice
        options:
          - 'update'
          - 'build'
      platform:
        description: 'Platform for Build'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'android'
          - 'ios'

defaults:
  run:
    working-directory: AB0-1-mobile

jobs:
  deploy:
    name: EAS Deployment
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Setup repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'AB0-1-mobile/package-lock.json'

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 EAS Update (Over-The-Air)
        if: github.event_name == 'push' || github.event.inputs.action == 'update'
        run: >-
          eas update --branch production --message "Auto-update from GitHub Actions: ${{ github.sha }}" --non-interactive

      - name: 🏗 EAS Build (Binaries)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'build'
        run: eas build --platform ${{ github.event.inputs.platform }} --profile production --non-interactive
