name: CD — Frontend Production Release

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Commit SHA from main whose frontend artifact changes are based on the active runtime SHA
        required: true
        type: string
      dry_run:
        description: Inspect runtime and validate plan without building or changing production
        required: true
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-release:
    name: Validate frontend release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release commit
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Este workflow só pode publicar um SHA da main."
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Informe um SHA completo de 40 caracteres."
            exit 1
          fi
          git fetch origin main --quiet
          git cat-file -e "${RELEASE_SHA}^{commit}"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD; then
            echo "::error::O SHA informado não pertence ao histórico atual da main."
            exit 1
          fi

  inspect-runtime:
    name: Reconcile production component evidence
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
      url: https://www.avaliasolar.com.br
    permissions:
      contents: read
      actions: read
    outputs:
      runtime_json: ${{ steps.inventory.outputs.runtime_json }}
      frontend_source_sha: ${{ steps.inventory.outputs.frontend_source_sha }}
      backend_source_sha: ${{ steps.inventory.outputs.backend_source_sha }}
      frontend_container_id: ${{ steps.inventory.outputs.frontend_container_id }}
      frontend_image_id: ${{ steps.inventory.outputs.frontend_image_id }}
      frontend_repo_digest: ${{ steps.inventory.outputs.frontend_repo_digest }}
      backend_container_id: ${{ steps.inventory.outputs.backend_container_id }}
      backend_image_id: ${{ steps.inventory.outputs.backend_image_id }}
      backend_repo_digest: ${{ steps.inventory.outputs.backend_repo_digest }}
      worker_container_id: ${{ steps.inventory.outputs.worker_container_id }}
      worker_image_id: ${{ steps.inventory.outputs.worker_image_id }}
      worker_repo_digest: ${{ steps.inventory.outputs.worker_repo_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Inspect runtime read-only and validate evidence
        id: inventory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          PRODUCTION_DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR }}
          PRODUCTION_BACKEND_SOURCE_SHA: ${{ vars.PRODUCTION_BACKEND_SOURCE_SHA }}
          PRODUCTION_BACKEND_IMAGE_ID: ${{ vars.PRODUCTION_BACKEND_IMAGE_ID }}
          PRODUCTION_WORKER_SOURCE_SHA: ${{ vars.PRODUCTION_WORKER_SOURCE_SHA }}
          PRODUCTION_WORKER_IMAGE_ID: ${{ vars.PRODUCTION_WORKER_IMAGE_ID }}
        run: |
          set -euo pipefail
          for required in PRODUCTION_BACKEND_SOURCE_SHA PRODUCTION_BACKEND_IMAGE_ID PRODUCTION_WORKER_SOURCE_SHA PRODUCTION_WORKER_IMAGE_ID; do
            [ -n "${!required:-}" ] || { echo "::error::Environment production var $required ausente; runtime sem baseline aprovada."; exit 1; }
          done
          REPORT="$RUNNER_TEMP/production-runtime.json"
          bash .github/scripts/release/ssh-readonly.sh \
            .github/scripts/release/inspect-runtime.sh > "$REPORT"
          if ! bash .github/scripts/release/validate-evidence.sh validate-runtime "$REPORT"; then
            echo "Runtime evidence rejected; divergence summary follows:" >&2
            jq -c '{manifest, manifest_divergences, components: (.components | with_entries(.value |= {config_image, image_id, repo_digests, source_sha, state, health}))}' "$REPORT" >&2
            exit 1
          fi
          bash .github/scripts/release/validate-runtime-baseline.sh \
            "$REPORT" "$PRODUCTION_BACKEND_SOURCE_SHA" "$PRODUCTION_BACKEND_IMAGE_ID" \
            "$PRODUCTION_WORKER_SOURCE_SHA" "$PRODUCTION_WORKER_IMAGE_ID"
          {
            echo '```json'
            jq '{manifest, manifest_divergences, components: (.components | with_entries(.value |= {container_id, config_image, image_id, repo_digests, source_sha, state, health}))}' "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "runtime_json<<RUNTIME_JSON"
            cat "$REPORT"
            echo "RUNTIME_JSON"
            for component in frontend backend worker; do
              echo "${component}_container_id=$(jq -r --arg c "$component" '.components[$c].container_id' "$REPORT")"
              echo "${component}_image_id=$(jq -r --arg c "$component" '.components[$c].image_id' "$REPORT")"
              echo "${component}_repo_digest=$(jq -r --arg c "$component" '.components[$c].repo_digests[0]' "$REPORT")"
            done
            echo "frontend_source_sha=$(jq -r '.components.frontend.source_sha' "$REPORT")"
            echo "backend_source_sha=$(jq -r '.components.backend.source_sha' "$REPORT")"
          } >> "$GITHUB_OUTPUT"

  verify-release-scope:
    name: Verify CI and artifact scope from running frontend SHA
    needs: [verify-release, inspect-runtime]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      RELEASE_BASE_SHA: ${{ needs.inspect-runtime.outputs.frontend_source_sha }}
      COMPATIBILITY_BASE_SHA: ${{ needs.inspect-runtime.outputs.backend_source_sha }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_SCOPE: frontend_only
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify CI and frontend artifact delta from runtime evidence
        run: |
          set -euo pipefail
          bash .github/scripts/verify-release-ci.sh
          bash .github/scripts/release/validate-frontend-scope.sh \
            "$RELEASE_BASE_SHA" "$COMPATIBILITY_BASE_SHA" "$RELEASE_SHA" \
            | tee "$RUNNER_TEMP/frontend-scope.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/frontend-scope.json"

  verify-frontend-backend-compatibility:
    name: Frontend E2E against backend source active in runtime
    needs: [verify-release, inspect-runtime, verify-release-scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Start isolated frontend/backend compatibility stack
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.test.yml up --build -d
          for attempt in $(seq 1 60); do
            backend_id="$(docker compose -f infra/docker/docker-compose.test.yml ps -q backend)"
            frontend_id="$(docker compose -f infra/docker/docker-compose.test.yml ps -q frontend)"
            backend_health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$backend_id" 2>/dev/null || echo missing)"
            frontend_health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$frontend_id" 2>/dev/null || echo missing)"
            if [ "$backend_health" = healthy ] && [ "$frontend_health" = healthy ]; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose -f infra/docker/docker-compose.test.yml ps
              docker compose -f infra/docker/docker-compose.test.yml logs --tail=150 backend frontend
              exit 1
            fi
            sleep 5
          done
        shell: bash

      - name: Install browser tests
        working-directory: ./AB0-1-front
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Run frontend/backend compatibility contracts
        working-directory: ./AB0-1-front
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          E2E_CATEGORY_SLUG: energia-solar
          E2E_PLACEMENT_SMOKE: true
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || 'test@avaliasolar.com.br' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || 'password123' }}
        run: |
          npm run test:banners
          npx playwright test

      - name: Tear down isolated compatibility stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.test.yml down --volumes

  dry-run-plan:
    name: Produce verified frontend-only plan
    if: ${{ inputs.dry_run == true }}
    needs: [verify-release, inspect-runtime, verify-release-scope, verify-frontend-backend-compatibility]
    runs-on: ubuntu-24.04
    steps:
      - name: Write read-only deployment plan
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUNTIME_JSON: ${{ needs.inspect-runtime.outputs.runtime_json }}
        run: |
          set -euo pipefail
          jq -n --arg sha "$RELEASE_SHA" --argjson runtime "$RUNTIME_JSON" '
            {
              mode: "dry_run",
              release_sha: $sha,
              action: "build_candidate_and_compare_digest",
              artifact_digest: "pending; build skipped in dry_run",
              components_to_change: ["frontend"],
              runtime_source_sha_matches: ($runtime.components.frontend.source_sha == $sha),
              frontend_current: {
                source_sha: $runtime.components.frontend.source_sha,
                container_id: $runtime.components.frontend.container_id,
                image_id: $runtime.components.frontend.image_id,
                repo_digest: $runtime.components.frontend.repo_digests[0]
              },
              components_preserved: {
                backend: {
                  container_id: $runtime.components.backend.container_id,
                  image_id: $runtime.components.backend.image_id,
                  repo_digest: $runtime.components.backend.repo_digests[0]
                },
                worker: {
                  container_id: $runtime.components.worker.container_id,
                  image_id: $runtime.components.worker.image_id,
                  repo_digest: $runtime.components.worker.repo_digests[0]
                }
              },
              rollback: $runtime.components.frontend.repo_digests[0],
              manifest_divergences: $runtime.manifest_divergences,
              migrations: false
            }
          ' | tee "$RUNNER_TEMP/frontend-release-plan.json" >> "$GITHUB_STEP_SUMMARY"

  build-frontend:
    name: Build frontend image
    if: ${{ inputs.dry_run == false }}
    needs: [verify-release-scope, inspect-runtime, verify-frontend-backend-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.immutable_ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Lowercase repository name
        id: repo_name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate frontend build secrets
        env:
          SERVER_ACTIONS_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$SERVER_ACTIONS_KEY" ] || { echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY ausente."; exit 1; }
          [ -n "$AUTH_SECRET" ] || { echo "::error::BETTER_AUTH_SECRET ausente."; exit 1; }

      - name: Build and publish frontend image by source SHA
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:${{ inputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            GIT_SHA=${{ inputs.release_sha }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.avaliasolar.com.br/api/v1' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.avaliasolar.com.br' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.avaliasolar.com.br' }}
            NEXT_PUBLIC_ENABLE_ANALYTICS=${{ vars.NEXT_PUBLIC_ENABLE_ANALYTICS || 'true' }}
            NEXT_PUBLIC_ENABLE_REALTIME=${{ vars.NEXT_PUBLIC_ENABLE_REALTIME || 'false' }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID || 'GTM-5RV76ZKR' }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL || 'https://avaliasolar.com.br' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
            NEXT_PUBLIC_LINKEDIN_CLIENT_ID=${{ vars.NEXT_PUBLIC_LINKEDIN_CLIENT_ID || '' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY || 'phc_oo5u9eWrjVdqdLRg1UbuiHnh5AZCp8SUxdgi68fGARd' }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://f.avaliasolar.com.br' }}
            NEXT_PUBLIC_PUBLIC_ORIGIN=${{ vars.NEXT_PUBLIC_PUBLIC_ORIGIN || 'https://www.avaliasolar.com.br' }}
            NEXT_PUBLIC_APP_ORIGIN=${{ vars.NEXT_PUBLIC_APP_ORIGIN || 'https://app.avaliasolar.com.br' }}
            NEXT_PUBLIC_CRM_ORIGIN=${{ vars.NEXT_PUBLIC_CRM_ORIGIN || 'https://crm.avaliasolar.com.br' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || '' }}
            NEXT_PUBLIC_ENABLE_PREMIUM_PROFILE=true
            NEXT_PUBLIC_GROUPS_ENABLED=true
          secrets: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache
            type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          labels: |
            org.opencontainers.image.revision=${{ inputs.release_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Validate published OCI digest
        id: immutable_ref
        env:
          ARTIFACT_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          DIGEST="$ARTIFACT_DIGEST"
          if [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            DIGEST="sha256:$DIGEST"
          fi
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::Build não retornou digest OCI válido ou contém prefixo duplicado."; exit 1; }
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}-frontend"
          echo "image=${REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Artefato imutável validado: ${REPOSITORY}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend only
    if: ${{ inputs.dry_run == false }}
    needs: [verify-release-scope, inspect-runtime, verify-frontend-backend-compatibility, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://www.avaliasolar.com.br
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      FRONTEND_IMAGE: ${{ needs.build-frontend.outputs.image }}
      EXPECTED_FRONTEND_CONTAINER_ID: ${{ needs.inspect-runtime.outputs.frontend_container_id }}
      EXPECTED_FRONTEND_IMAGE_ID: ${{ needs.inspect-runtime.outputs.frontend_image_id }}
      EXPECTED_FRONTEND_REPO_DIGEST: ${{ needs.inspect-runtime.outputs.frontend_repo_digest }}
      EXPECTED_BACKEND_CONTAINER_ID: ${{ needs.inspect-runtime.outputs.backend_container_id }}
      EXPECTED_BACKEND_IMAGE_ID: ${{ needs.inspect-runtime.outputs.backend_image_id }}
      EXPECTED_BACKEND_REPO_DIGEST: ${{ needs.inspect-runtime.outputs.backend_repo_digest }}
      EXPECTED_WORKER_CONTAINER_ID: ${{ needs.inspect-runtime.outputs.worker_container_id }}
      EXPECTED_WORKER_IMAGE_ID: ${{ needs.inspect-runtime.outputs.worker_image_id }}
      EXPECTED_WORKER_REPO_DIGEST: ${{ needs.inspect-runtime.outputs.worker_repo_digest }}
    steps:
      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          [ -n "$SSH_HOST" ] || { echo "::error::SSH_HOST ausente."; exit 1; }
          [ -n "$SSH_USER" ] || { echo "::error::SSH_USER ausente."; exit 1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::SSH_PRIVATE_KEY ausente."; exit 1; }
          [ -n "$SSH_HOST_FINGERPRINT" ] || { echo "::error::SSH_HOST_FINGERPRINT ausente."; exit 1; }

      - name: Update frontend container over SSH
        id: deploy_frontend
        uses: appleboy/ssh-action@v1.1.0
        env:
          DOCKER_USER: ${{ github.actor }}
          DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GIT_SHA: ${{ env.RELEASE_SHA }}
          PRODUCTION_DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          EXPECTED_FRONTEND_CONTAINER_ID: ${{ env.EXPECTED_FRONTEND_CONTAINER_ID }}
          EXPECTED_FRONTEND_IMAGE_ID: ${{ env.EXPECTED_FRONTEND_IMAGE_ID }}
          EXPECTED_FRONTEND_REPO_DIGEST: ${{ env.EXPECTED_FRONTEND_REPO_DIGEST }}
          EXPECTED_BACKEND_CONTAINER_ID: ${{ env.EXPECTED_BACKEND_CONTAINER_ID }}
          EXPECTED_BACKEND_IMAGE_ID: ${{ env.EXPECTED_BACKEND_IMAGE_ID }}
          EXPECTED_BACKEND_REPO_DIGEST: ${{ env.EXPECTED_BACKEND_REPO_DIGEST }}
          EXPECTED_WORKER_CONTAINER_ID: ${{ env.EXPECTED_WORKER_CONTAINER_ID }}
          EXPECTED_WORKER_IMAGE_ID: ${{ env.EXPECTED_WORKER_IMAGE_ID }}
          EXPECTED_WORKER_REPO_DIGEST: ${{ env.EXPECTED_WORKER_REPO_DIGEST }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 15m
          envs: DOCKER_USER,DOCKER_TOKEN,GH_REPOSITORY,GIT_SHA,PRODUCTION_DEPLOY_DIR,FRONTEND_IMAGE,EXPECTED_FRONTEND_CONTAINER_ID,EXPECTED_FRONTEND_IMAGE_ID,EXPECTED_FRONTEND_REPO_DIGEST,EXPECTED_BACKEND_CONTAINER_ID,EXPECTED_BACKEND_IMAGE_ID,EXPECTED_BACKEND_REPO_DIGEST,EXPECTED_WORKER_CONTAINER_ID,EXPECTED_WORKER_IMAGE_ID,EXPECTED_WORKER_REPO_DIGEST
          script: |
            set -Eeuo pipefail
            DEPLOY_DIR="${PRODUCTION_DEPLOY_DIR:-${HOME:-}/Avalia-Solar-2026}"
            cd "$DEPLOY_DIR"
            test -f docker-compose.yml

            REPO_LOWER="$(printf '%s' "$GH_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            FRONTEND_REPOSITORY="ghcr.io/${REPO_LOWER}-frontend"
            case "$FRONTEND_IMAGE" in
              "${FRONTEND_REPOSITORY}"@sha256:*) FRONTEND_DIGEST="${FRONTEND_IMAGE#"${FRONTEND_REPOSITORY}"@}" ;;
              *) echo "Repositório da imagem frontend diverge."; exit 1 ;;
            esac
            [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "Referência OCI frontend inválida ou com prefixo duplicado."; exit 1; }

            assert_component_identity() {
              local container="$1" expected_container="$2" expected_image_id="$3" expected_repo_digest="$4"
              local actual_container actual_image_id actual_repo_digests health
              actual_container="$(docker inspect --format='{{.Id}}' "$container")"
              actual_image_id="$(docker inspect --format='{{.Image}}' "$container")"
              actual_repo_digests="$(docker image inspect "$actual_image_id" --format='{{json .RepoDigests}}')"
              health="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")"
              [ "$actual_container" = "$expected_container" ] || { echo "Container $container mudou após preflight."; return 1; }
              [ "$actual_image_id" = "$expected_image_id" ] || { echo "Image ID de $container divergiu do preflight."; return 1; }
              jq -e --arg digest "$expected_repo_digest" 'index($digest) != null' <<< "$actual_repo_digests" >/dev/null \
                || { echo "Digest OCI de $container divergiu do preflight."; return 1; }
              [ "$health" = healthy ] || { echo "Health check de $container não está healthy."; return 1; }
            }

            assert_component_identity ab0-frontend "$EXPECTED_FRONTEND_CONTAINER_ID" "$EXPECTED_FRONTEND_IMAGE_ID" "$EXPECTED_FRONTEND_REPO_DIGEST"
            assert_component_identity ab0-backend "$EXPECTED_BACKEND_CONTAINER_ID" "$EXPECTED_BACKEND_IMAGE_ID" "$EXPECTED_BACKEND_REPO_DIGEST"
            assert_component_identity ab0-worker "$EXPECTED_WORKER_CONTAINER_ID" "$EXPECTED_WORKER_IMAGE_ID" "$EXPECTED_WORKER_REPO_DIGEST"

            CURRENT_FRONTEND_DIGEST="$EXPECTED_FRONTEND_REPO_DIGEST"
            PREVIOUS_IMAGE="$CURRENT_FRONTEND_DIGEST"
            PREVIOUS_IMAGE_ID="$EXPECTED_FRONTEND_IMAGE_ID"
            mkdir -p .deploy
            ROLLBACK_TMP="$(mktemp .deploy/frontend-rollback.XXXXXX)"
            umask 077
            printf 'PREVIOUS_FRONTEND_IMAGE=%s\nPREVIOUS_FRONTEND_IMAGE_ID=%s\n' \
              "$PREVIOUS_IMAGE" "$PREVIOUS_IMAGE_ID" > "$ROLLBACK_TMP"
            mv "$ROLLBACK_TMP" .deploy/frontend-rollback.env
            if [ "$CURRENT_FRONTEND_DIGEST" = "$FRONTEND_IMAGE" ]; then
              echo "NO_OP: frontend já executa digest solicitado."
              exit 0
            fi

            DOCKER_CONFIG="$(mktemp -d)"
            export DOCKER_CONFIG
            cleanup_registry_auth() {
              docker logout ghcr.io >/dev/null 2>&1 || true
              rm -rf "$DOCKER_CONFIG"
            }
            trap cleanup_registry_auth EXIT
            printf '%s' "$DOCKER_TOKEN" | docker login ghcr.io -u "$DOCKER_USER" --password-stdin
            docker pull "$FRONTEND_IMAGE"
            TARGET_IMAGE_ID="$(docker image inspect "$FRONTEND_IMAGE" --format='{{.Id}}')"
            TARGET_REPO_DIGESTS="$(docker image inspect "$FRONTEND_IMAGE" --format='{{json .RepoDigests}}')"
            jq -e --arg digest "$FRONTEND_IMAGE" 'index($digest) != null' <<< "$TARGET_REPO_DIGESTS" >/dev/null \
              || { echo "Imagem alvo não resolve para o digest OCI esperado."; exit 1; }

            wait_for_frontend() {
              local container_id status state attempt
              container_id="$(docker compose ps -q frontend)"
              [ -n "$container_id" ] || return 1
              for attempt in $(seq 1 180); do
                status="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || echo missing)"
                state="$(docker inspect --format='{{.State.Status}}' "$container_id" 2>/dev/null || echo missing)"
                [ "$status" = healthy ] && return 0
                if [ "$state" = exited ] || [ "$status" = unhealthy ] || [ "$status" = missing ]; then
                  docker compose logs --tail=150 frontend || true
                  return 1
                fi
                sleep 2
              done
              docker compose logs --tail=150 frontend || true
              return 1
            }

            rollback_frontend() {
              echo "Rollback apenas do frontend para digest anterior."
              export FRONTEND_IMAGE="$PREVIOUS_IMAGE"
              docker compose up -d --no-deps --no-build frontend
              wait_for_frontend
              local restored_id
              restored_id="$(docker inspect --format='{{.Image}}' ab0-frontend)"
              [ "$restored_id" = "$PREVIOUS_IMAGE_ID" ] || { echo "Rollback não restaurou Image ID anterior."; return 1; }
              assert_component_identity ab0-backend "$EXPECTED_BACKEND_CONTAINER_ID" "$EXPECTED_BACKEND_IMAGE_ID" "$EXPECTED_BACKEND_REPO_DIGEST"
              assert_component_identity ab0-worker "$EXPECTED_WORKER_CONTAINER_ID" "$EXPECTED_WORKER_IMAGE_ID" "$EXPECTED_WORKER_REPO_DIGEST"
            }

            export FRONTEND_IMAGE="$FRONTEND_IMAGE"
            if ! docker compose up -d --no-deps --no-build frontend; then
              rollback_frontend || echo "::error::Rollback frontend falhou."
              exit 1
            fi
            if ! wait_for_frontend; then
              rollback_frontend || echo "::error::Rollback frontend falhou."
              exit 1
            fi

            RUNNING_FRONTEND_ID="$(docker inspect --format='{{.Image}}' ab0-frontend)"
            [ "$RUNNING_FRONTEND_ID" = "$TARGET_IMAGE_ID" ] || {
              echo "Image ID ativo não corresponde ao artefato construído."
              rollback_frontend || echo "::error::Rollback frontend falhou."
              exit 1
            }
            RUNNING_FRONTEND_DIGESTS="$(docker image inspect "$RUNNING_FRONTEND_ID" --format='{{json .RepoDigests}}')"
            jq -e --arg digest "$FRONTEND_IMAGE" 'index($digest) != null' <<< "$RUNNING_FRONTEND_DIGESTS" >/dev/null || {
              echo "Digest OCI ativo diverge do artefato construído."
              rollback_frontend || echo "::error::Rollback frontend falhou."
              exit 1
            }
            RUNNING_REVISION="$(docker image inspect "$RUNNING_FRONTEND_ID" --format='{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            [ "$RUNNING_REVISION" = "$GIT_SHA" ] || {
              echo "OCI revision diverge do commit solicitado."
              rollback_frontend || echo "::error::Rollback frontend falhou."
              exit 1
            }

            if ! assert_component_identity ab0-backend "$EXPECTED_BACKEND_CONTAINER_ID" "$EXPECTED_BACKEND_IMAGE_ID" "$EXPECTED_BACKEND_REPO_DIGEST" \
              || ! assert_component_identity ab0-worker "$EXPECTED_WORKER_CONTAINER_ID" "$EXPECTED_WORKER_IMAGE_ID" "$EXPECTED_WORKER_REPO_DIGEST"; then
              echo "Backend/worker drift pós-deploy; restaurando frontend anterior."
              rollback_frontend || echo "::error::Rollback frontend falhou."
              exit 1
            fi

            FRONTEND_CID="$(docker compose ps -q frontend)"
            if ! docker exec -e EXPECTED_RELEASE_SHA="$GIT_SHA" "$FRONTEND_CID" node -e '
              (async () => {
                const response = await fetch("http://127.0.0.1:3000/");
                const html = await response.text();
                const required = ["company-registration-ticker", "CADASTRAR", "wa.me/5565993465055?text=CADASTRAR"];
                if (!response.ok || response.headers.get("x-release") !== process.env.EXPECTED_RELEASE_SHA
                  || required.some((value) => !html.includes(value))) {
                  throw new Error(`Smoke complementar inválido: HTTP ${response.status}`);
                }
                console.log("FRONTEND_TICKER_SMOKE_OK (digest e OCI revision verificados separadamente)");
              })().catch((error) => { console.error(error); process.exit(1); });
            '; then
              rollback_frontend
              exit 1
            fi
            docker inspect ab0-frontend --format='Frontend image={{.Config.Image}} status={{.State.Status}}'

      - name: Verify public homepage and release SHA
        env:
          RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail
          HEADER_FILE="$RUNNER_TEMP/frontend-release-headers"
          PAGE_FILE="$RUNNER_TEMP/frontend-release-page"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 25 -D "$HEADER_FILE" -o "$PAGE_FILE" \
              -H 'Cache-Control: no-cache, no-store' \
              "https://www.avaliasolar.com.br/?frontend_release=${RELEASE_SHA}" 2>/dev/null; then
              RELEASE_HEADER="$(awk 'tolower($1) == "x-release:" { gsub(/[[:space:]]/, "", $2); value = $2 } END { print value }' "$HEADER_FILE")"
            else
              RELEASE_HEADER=""
            fi
            if [ "$RELEASE_HEADER" = "$RELEASE_SHA" ] \
              && grep -qF 'company-registration-ticker' "$PAGE_FILE" \
              && grep -qF 'CADASTRAR' "$PAGE_FILE" \
              && grep -qF 'wa.me/5565993465055?text=CADASTRAR' "$PAGE_FILE"; then
              echo "Homepage pública serve a faixa no release ${RELEASE_SHA}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Frontend local atualizado, mas a homepage pública não confirmou a faixa."
          exit 1

      - name: Roll back frontend if public verification failed
        if: failure() && steps.deploy_frontend.outcome == 'success'
        uses: appleboy/ssh-action@v1.1.0
        env:
          GH_REPOSITORY: ${{ github.repository }}
          PRODUCTION_DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR }}
          EXPECTED_BACKEND_CONTAINER_ID: ${{ env.EXPECTED_BACKEND_CONTAINER_ID }}
          EXPECTED_BACKEND_IMAGE_ID: ${{ env.EXPECTED_BACKEND_IMAGE_ID }}
          EXPECTED_BACKEND_REPO_DIGEST: ${{ env.EXPECTED_BACKEND_REPO_DIGEST }}
          EXPECTED_WORKER_CONTAINER_ID: ${{ env.EXPECTED_WORKER_CONTAINER_ID }}
          EXPECTED_WORKER_IMAGE_ID: ${{ env.EXPECTED_WORKER_IMAGE_ID }}
          EXPECTED_WORKER_REPO_DIGEST: ${{ env.EXPECTED_WORKER_REPO_DIGEST }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 10m
          envs: GH_REPOSITORY,PRODUCTION_DEPLOY_DIR,EXPECTED_BACKEND_CONTAINER_ID,EXPECTED_BACKEND_IMAGE_ID,EXPECTED_BACKEND_REPO_DIGEST,EXPECTED_WORKER_CONTAINER_ID,EXPECTED_WORKER_IMAGE_ID,EXPECTED_WORKER_REPO_DIGEST
          script: |
            set -Eeuo pipefail
            DEPLOY_DIR="${PRODUCTION_DEPLOY_DIR:-${HOME:-}/Avalia-Solar-2026}"
            cd "$DEPLOY_DIR"
            ROLLBACK_FILE=.deploy/frontend-rollback.env
            [ -r "$ROLLBACK_FILE" ] || { echo "Rollback frontend sem registro verificável."; exit 1; }
            PREVIOUS_FRONTEND_IMAGE="$(awk -F= '$1 == "PREVIOUS_FRONTEND_IMAGE" {sub(/^[^=]*=/, ""); print; exit}' "$ROLLBACK_FILE")"
            PREVIOUS_FRONTEND_IMAGE_ID="$(awk -F= '$1 == "PREVIOUS_FRONTEND_IMAGE_ID" {sub(/^[^=]*=/, ""); print; exit}' "$ROLLBACK_FILE")"
            [[ "$PREVIOUS_FRONTEND_IMAGE" =~ ^ghcr\.io/.+-frontend@sha256:[0-9a-f]{64}$ ]] \
              || { echo "Digest rollback inválido."; exit 1; }
            [ "$PREVIOUS_FRONTEND_IMAGE_ID" = "$(docker image inspect "$PREVIOUS_FRONTEND_IMAGE" --format='{{.Id}}')" ] \
              || { echo "Image ID do rollback diverge do registro."; exit 1; }
            assert_preserved() {
              local container="$1" expected_container="$2" expected_image_id="$3" expected_digest="$4"
              [ "$(docker inspect --format='{{.Id}}' "$container")" = "$expected_container" ]
              [ "$(docker inspect --format='{{.Image}}' "$container")" = "$expected_image_id" ]
              [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container")" = healthy ]
              docker image inspect "$expected_image_id" --format='{{json .RepoDigests}}' \
                | jq -e --arg digest "$expected_digest" 'index($digest) != null' >/dev/null
            }
            assert_preserved ab0-backend "$EXPECTED_BACKEND_CONTAINER_ID" "$EXPECTED_BACKEND_IMAGE_ID" "$EXPECTED_BACKEND_REPO_DIGEST"
            assert_preserved ab0-worker "$EXPECTED_WORKER_CONTAINER_ID" "$EXPECTED_WORKER_IMAGE_ID" "$EXPECTED_WORKER_REPO_DIGEST"
            export FRONTEND_IMAGE="$PREVIOUS_FRONTEND_IMAGE"
            docker image inspect "$FRONTEND_IMAGE" >/dev/null
            docker compose up -d --no-deps --no-build frontend
            CID="$(docker compose ps -q frontend)"
            for attempt in $(seq 1 180); do
              STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CID" 2>/dev/null || echo missing)"
              if [ "$STATUS" = healthy ]; then
                RESTORED_ID="$(docker inspect --format='{{.Image}}' "$CID")"
                [ "$RESTORED_ID" = "$PREVIOUS_FRONTEND_IMAGE_ID" ] || { echo "Rollback Image ID diverge."; exit 1; }
                docker image inspect "$RESTORED_ID" --format='{{json .RepoDigests}}' \
                  | jq -e --arg digest "$PREVIOUS_FRONTEND_IMAGE" 'index($digest) != null' >/dev/null
                assert_preserved ab0-backend "$EXPECTED_BACKEND_CONTAINER_ID" "$EXPECTED_BACKEND_IMAGE_ID" "$EXPECTED_BACKEND_REPO_DIGEST"
                assert_preserved ab0-worker "$EXPECTED_WORKER_CONTAINER_ID" "$EXPECTED_WORKER_IMAGE_ID" "$EXPECTED_WORKER_REPO_DIGEST"
                echo "Rollback frontend verificado por Image ID e digest OCI."
                exit 0
              fi
              sleep 2
            done
            docker compose logs --tail=150 frontend || true
            exit 1
