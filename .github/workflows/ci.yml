name: CI

on:
  push:
    branches: [ "main", "staging", "develop" ]
  pull_request:
    branches: [ "main", "staging", "develop" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x]

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: AB0-1-front/package-lock.json

    - name: Install Dependencies
      working-directory: ./AB0-1-front
      run: npm ci

    - name: Lint
      working-directory: ./AB0-1-front
      run: npm run lint -- --quiet || echo "Lint warnings detected, but allowed to proceed"

    - name: Test
      working-directory: ./AB0-1-front
      run: npm run test:ci

    - name: Build
      working-directory: ./AB0-1-front
      env:
        NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
        NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:3001"
        NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
        NEXT_PUBLIC_BETTER_AUTH_URL: "http://localhost:3000"
        NEXT_PUBLIC_GTM_ID: "GTM-5RV76ZKR"
        BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'placeholder-secret' }}
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY || 'placeholder-key-for-build' }}
      run: |
        npm run build
