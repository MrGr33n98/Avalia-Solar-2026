name: Security Scans

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend Scan
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Ruby Dependency Scan
        working-directory: ./AB0-1-back
        run: |
          gem install bundler-audit
          bundle audit check --update

      # Frontend Scan
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AB0-1-front/package-lock.json

      - name: Node Dependency Scan
        working-directory: ./AB0-1-front
        run: |
          npm audit --audit-level=high

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Brakeman (Rails Security)
        working-directory: ./AB0-1-back
        run: |
          gem install brakeman
          brakeman --format sarif -o brakeman.sarif
        continue-on-error: true

      - name: Upload Brakeman SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: AB0-1-back/brakeman.sarif
          category: brakeman
