name: Security Scans

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Backend Scan
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Ruby Dependency Scan
        working-directory: ./AB0-1-back
        run: |
          gem install bundler-audit
          bundle exec bundle-audit check --update --format text | tee bundler-audit-report.txt
        continue-on-error: true

      - name: Upload Ruby Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruby-bundler-audit-report
          path: AB0-1-back/bundler-audit-report.txt
          if-no-files-found: warn

      # Frontend Scan
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: AB0-1-front/package-lock.json

      - name: Node Dependency Scan
        working-directory: ./AB0-1-front
        run: |
          npm audit --audit-level=high
        continue-on-error: true

  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Brakeman (Rails Security)
        working-directory: ./AB0-1-back
        run: |
          gem install brakeman
          bundle exec brakeman --format sarif -o brakeman.sarif || true
          if [ ! -f brakeman.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > brakeman.sarif
          fi
        continue-on-error: true

      - name: Upload Brakeman SARIF
        if: always() && hashFiles('AB0-1-back/brakeman.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: AB0-1-back/brakeman.sarif
          category: brakeman
