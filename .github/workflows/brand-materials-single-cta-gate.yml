name: Brand Materials — Single CTA Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-front/app/companies/[id]/components/MaterialLeadMagnetCard.tsx'
      - 'AB0-1-front/app/companies/[id]/components/SidebarPremium.tsx'
      - 'AB0-1-front/app/companies/[id]/components/MaterialLeadMagnetCard.spec.tsx'
      - 'AB0-1-front/app/companies/[id]/components/SidebarPremium.spec.tsx'
      - '.github/workflows/brand-materials-single-cta-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-materials:
    name: Card Único e Downloads (Jest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Validar card quadrado, gating e ausência de duplicidade
        run: npm test -- MaterialLeadMagnetCard.spec.tsx SidebarPremium.spec.tsx --runInBand --coverage=false
