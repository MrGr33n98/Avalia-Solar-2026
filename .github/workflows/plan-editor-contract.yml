name: Plan Editor Contract (ActiveAdmin)

on:
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-back/app/admin/plans.rb'
      - 'AB0-1-back/app/models/plan.rb'
      - 'AB0-1-back/app/models/plan_feature_catalog.rb'
      - 'AB0-1-back/app/policies/plan_policy.rb'
      - 'AB0-1-back/spec/requests/admin_plans_spec.rb'
      - 'AB0-1-back/db/migrate/**'
      - '.github/workflows/plan-editor-contract.yml'

permissions:
  contents: read

jobs:
  plan-editor-contract:
    name: Plan editor model/request specs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
      RAILS_ENV: test
      SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back
      - name: Prepare isolated test database
        working-directory: ./AB0-1-back
        run: bundle exec rails db:create db:schema:load db:migrate
      - name: Check Rails autoload and editor tests
        working-directory: ./AB0-1-back
        run: |
          bundle exec rails zeitwerk:check
          bundle exec rspec spec/requests/admin_plans_spec.rb spec/models/plan_spec.rb spec/models/plan_feature_catalog_spec.rb
