name: Conversion Omnichannel — Contracts (TDD)

on:
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-back/app/domain/company_conversion/**'
      - 'AB0-1-back/app/services/company_conversion/**'
      - 'AB0-1-back/app/services/recommendation/**'
      - 'AB0-1-back/app/serializers/recommendation_serializer.rb'
      - 'AB0-1-back/app/controllers/api/v1/recommendations_controller.rb'
      - 'AB0-1-back/spec/domain/company_conversion/**'
      - 'AB0-1-back/spec/services/company_conversion/**'
      - 'AB0-1-back/spec/services/recommendation/**'
      - 'AB0-1-front/components/company/RecommendedCompanyCard*'
      - 'AB0-1-front/app/dashboard/components/conversion-surfaces/**'
      - 'AB0-1-front/lib/analytics/recommendations.ts'
      - '.github/workflows/conversion-omnichannel-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Conversion Frontend — Jest & TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: ./AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Install
        run: npm ci
      - name: CTA and Surface contracts
        run: |
          npm test -- --runInBand \
            components/company/RecommendedCompanyCard.spec.tsx \
            __tests__/components/RecommendedCompaniesSection.test.tsx \
            app/dashboard/components/conversion-surfaces/ConversionSurfacesOverview.spec.tsx \
            app/dashboard/components/cta-visibility/CtaVisibilitySettings.spec.tsx \
            lib/feature-access.spec.ts
      - name: TypeScript
        run: npm run typecheck

  backend:
    name: Conversion Domain — RSpec
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back
      - name: Run conversion domain and recommendation contract
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rails db:create db:schema:load db:migrate
          bundle exec rails zeitwerk:check
          bundle exec rspec \
            spec/domain/company_conversion/conversion_surface_registry_spec.rb \
            spec/services/company_conversion/surface_snapshot_spec.rb \
            spec/services/recommendation/cta_resolver_spec.rb \
            spec/services/recommendation/engine_spec.rb \
            spec/requests/api/v1/recommendations_quote_visibility_spec.rb
