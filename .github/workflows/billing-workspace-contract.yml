name: Billing Workspace — Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-front/app/dashboard/components/PlanAndSubscription.tsx'
      - 'AB0-1-front/app/dashboard/components/PlansPricingModal.tsx'
      - 'AB0-1-front/app/dashboard/components/EnterpriseDashboard.tsx'
      - 'AB0-1-front/components/billing/**'
      - 'AB0-1-front/lib/billing/**'
      - 'AB0-1-front/__tests__/dashboard/**'
      - 'AB0-1-back/app/controllers/api/v1/billing/**'
      - 'AB0-1-back/app/controllers/api/v1/company_dashboard_controller.rb'
      - 'AB0-1-back/spec/requests/api/v1/company_dashboard_freshness_spec.rb'
      - 'AB0-1-back/app/policies/billing_policy.rb'
      - 'AB0-1-back/app/serializers/billing/**'
      - 'AB0-1-back/app/services/company_feature_access_resolver.rb'
      - 'AB0-1-back/spec/policies/billing_policy_spec.rb'
      - 'AB0-1-back/spec/requests/api/v1/billing/**'
      - 'AB0-1-back/spec/services/company_feature_access_resolver_spec.rb'
      - 'AB0-1-back/app/services/entitlement_service.rb'
      - 'AB0-1-back/spec/services/entitlement_service_spec.rb'
      - '.github/workflows/billing-workspace-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-contract:
    name: Billing UI — Jest and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - run: npm ci
      - name: Billing dashboard contracts
        run: npm test -- --runInBand __tests__/dashboard/PlanAndSubscription.test.tsx __tests__/dashboard/PlansPricingModal.test.tsx
      - name: TypeScript
        run: npm run typecheck

  backend-entitlements:
    name: Billing entitlements — RSpec
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back
      - name: Database and entitlement specs
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rails db:create db:schema:load db:migrate
          bundle exec rails runner script/schema_contract_check.rb
          if ! bundle exec rspec \
            spec/services/entitlement_service_spec.rb \
            spec/services/company_feature_access_resolver_spec.rb \
            spec/policies/billing_policy_spec.rb \
            spec/requests/api/v1/billing/checkout_spec.rb \
            spec/requests/api/v1/company_dashboard_freshness_spec.rb; then
            echo "::group::Billing exception diagnostics"
            grep -n -A 4 -B 2 -E 'BillingSubscription#show|CompanyDashboard#subscription' log/test.log | tail -n 80 || true
            echo "::endgroup::"
            exit 1
          fi
