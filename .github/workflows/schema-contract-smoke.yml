name: Schema Contract — Pre-deploy Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-back/db/**'
      - 'AB0-1-back/script/schema_contract_check.rb'
      - '.github/workflows/schema-contract-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-contract:
    name: Fresh Schema → Migrations → Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back
      - name: Verify source schema plus pending migrations
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rails db:create db:schema:load db:migrate
          bundle exec rails runner script/schema_contract_check.rb
          bundle exec rails zeitwerk:check
