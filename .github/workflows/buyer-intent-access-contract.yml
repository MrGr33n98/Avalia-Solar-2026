name: Buyer Intent — Access and Truthful Data Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-front/lib/api/buyer-intent.ts'
      - 'AB0-1-front/hooks/buyer-intent.spec.tsx'
      - 'AB0-1-front/app/dashboard/components/intent/**'
      - 'AB0-1-front/lib/analytics/hooks/useIntentTracking.ts'
      - 'AB0-1-back/app/controllers/api/v1/intent_*'
      - 'AB0-1-back/app/controllers/api/v1/identity_stitch_controller.rb'
      - 'AB0-1-back/app/models/buyer_intent_activity.rb'
      - 'AB0-1-back/app/models/intent_score.rb'
      - 'AB0-1-back/spec/models/buyer_intent_activity_spec.rb'
      - 'AB0-1-back/spec/models/intent_score_spec.rb'
      - 'AB0-1-back/spec/requests/api/v1/intent_*'
      - 'AB0-1-back/spec/requests/api/v1/identity_stitch_spec.rb'
      - '.github/workflows/buyer-intent-access-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buyer-intent:
    name: Buyer Intent — Jest and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Regressions — 403 feature/policy, 401, 500, valid zero
        run: npm test -- --runInBand hooks/buyer-intent.spec.tsx app/dashboard/components/intent/ProfileSignalsTab.spec.tsx __tests__/hooks/useIntentTracking.test.tsx
      - name: TypeScript contracts
        run: npm run typecheck

  backend-contract:
    name: Buyer Intent API & Scoring — RSpec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back
      - name: Run Buyer Intent RSpec contract
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rails db:create db:schema:load db:migrate
          bundle exec rspec \
            spec/models/buyer_intent_activity_spec.rb \
            spec/models/intent_score_spec.rb \
            spec/requests/api/v1/intent_signals_spec.rb \
            spec/requests/api/v1/intent_scores_spec.rb \
            spec/requests/api/v1/identity_stitch_spec.rb
