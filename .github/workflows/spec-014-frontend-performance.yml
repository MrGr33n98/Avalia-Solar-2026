name: Spec 014 — Frontend Performance Regression

on:
  pull_request:
    paths:
      - 'AB0-1-front/**'
      - 'specs/014-frontend-performance-remediation/**'
      - '.github/workflows/spec-014-frontend-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec014-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-checks:
    name: Spec 014 Jest + TypeScript + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused server loader/hydration/measurement regression tests
        run: >
          npm test -- --ci --runInBand
          lib/server/performance/loaders.spec.ts
          __tests__/hooks/useCatalogProductsInitial.spec.tsx
          lib/analytics/route-performance.spec.ts
      - name: TypeScript
        run: npm run typecheck
      - name: Full lint (existing repository debt, visible but nonblocking)
        id: legacy_lint
        continue-on-error: true
        run: npm run lint
      - name: Enforced lint for new server/observability files
        run: >
          npx eslint
          lib/server/performance/loaders.ts
          lib/server/performance/types.ts
          lib/server/performance/loaders.spec.ts
          lib/analytics/route-performance.ts
          lib/analytics/route-performance.spec.ts
          app/search/page.tsx
          app/products/page.tsx
      - name: Record full lint debt in job summary
        if: always()
        run: |
          echo "Full repository lint: ${{ steps.legacy_lint.outcome }} (pre-existing unrelated errors remain a release acceptance blocker)" >> "$GITHUB_STEP_SUMMARY"
          echo "Enforced: Spec 014 new files lint, focused Jest, TypeScript and build." >> "$GITHUB_STEP_SUMMARY"
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
