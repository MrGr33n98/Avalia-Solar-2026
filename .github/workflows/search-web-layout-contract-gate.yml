name: Search Desktop Layout Contract Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-front/components/search/**'
      - 'AB0-1-front/app/search/**'
      - '.github/workflows/search-web-layout-contract-gate.yml'

permissions:
  contents: read

concurrency:
  group: search-web-layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  search-ui:
    name: Search hero, company cards and TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Run search presentation regression tests
        run: |
          npm test -- --runInBand \
            components/search/SearchHero.spec.tsx \
            components/search/SearchCompanyListCard.spec.tsx \
            components/search/SearchResultsHeader.spec.tsx
