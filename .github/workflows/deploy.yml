name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e

            echo "--- 1. Navegando para a pasta do projeto ---"
            cd ~/Avalia-Solar-2026

            echo "--- 2. Atualizando codigo fonte (Git) ---"
            git config --global --add safe.directory ~/Avalia-Solar-2026
            git fetch origin main
            git reset --hard origin/main

            echo "--- 3. Carregando Chaves de Seguranca ---"
            # COMANDO NOVO: Forca o carregamento das variaveis do .env para o Shell
            # Isso garante que a RAILS_MASTER_KEY seja passada para o Docker
            if [ -f .env ]; then
              export $(grep -v '^#' .env | xargs)
              echo "Variaveis de ambiente carregadas do arquivo .env"
            else
              echo "ERRO CRITICO: Arquivo .env nao encontrado!"
              exit 1
            fi

            echo "--- 4. Deploy com Docker ---"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            echo "--- 4.1 Derrubando containers antigos ---"
            docker-compose down --remove-orphans || true

            echo "--- 4.2 Subindo novos containers ---"
            # Agora a variavel ${RAILS_MASTER_KEY} estara preenchida
            docker-compose up -d --build

            echo "--- 5. Limpeza de imagens ---"
            docker image prune -f

            echo "Deploy finalizado com sucesso!"
