name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60m
          command_timeout: 60m
          keepalive_interval: 30s
          script: |
            set -e

            echo "--- 1. Navegando para a pasta do projeto ---"
            cd ~/Avalia-Solar-2026

            echo "--- 2. Atualizando código fonte ---"
            # Baixa as novidades
            git fetch origin main
            # Força o servidor a ficar IDÊNTICO ao GitHub
            git reset --hard origin/main

            echo "--- 3. Deploy Inteligente com Docker ---"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Carrega variáveis do .env (Garante que a Master Key seja lida)
            if [ -f .env ]; then
              export $(cat .env | grep -v '#' | awk '/=/ {print $1}')
            fi

            # O comando mágico:
            # --build: Reconstrói se houver mudanças (agora com a KEY correta!)
            # -d: Roda em background
            # --remove-orphans: Limpa containers velhos
            docker-compose up -d --build --remove-orphans

            echo "--- 4. Limpeza ---"
            docker image prune -f

            echo "✅ Deploy finalizado com sucesso!"