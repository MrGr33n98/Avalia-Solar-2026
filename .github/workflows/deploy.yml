name: Deploy to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 60m
          script: |
            set -e
            cd ~/Avalia-Solar-2026
            git fetch --depth=2 origin main
            git checkout -f main
            git reset --hard origin/main
            export COMPOSE_PROJECT_NAME=ab0
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD || true)
            if command -v rg >/dev/null 2>&1; then
              FRONT_CHANGED=$(echo "$CHANGED_FILES" | rg -n "^(AB0-1-front/|package.json|package-lock.json|yarn.lock|AB0-1-front/package\.json|AB0-1-front/package-lock\.json|AB0-1-front/yarn\.lock|AB0-1-front/next\.config\.js|AB0-1-front/tsconfig\.json)" || true)
              BACK_CHANGED=$(echo "$CHANGED_FILES" | rg -n "^(AB0-1-back/|Gemfile|Gemfile\.lock|config\.ru|Rakefile)" || true)
            else
              FRONT_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^(AB0-1-front/|package.json|package-lock.json|yarn.lock|AB0-1-front/package\.json|AB0-1-front/package-lock\.json|AB0-1-front/yarn\.lock|AB0-1-front/next\.config\.js|AB0-1-front/tsconfig\.json)" || true)
              BACK_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^(AB0-1-back/|Gemfile|Gemfile\.lock|config\.ru|Rakefile)" || true)
            fi
            REMOVE_FRONT=$(docker ps -a --format '{{.ID}} {{.Names}}' | awk '/ab0-frontend/ {print $1}')
            REMOVE_BACK=$(docker ps -a --format '{{.ID}} {{.Names}}' | awk '/ab0-backend/ {print $1}')
            if [ -n "$FRONT_CHANGED" ] && [ -n "$BACK_CHANGED" ]; then
              [ -n "$REMOVE_FRONT" ] && docker rm -f $REMOVE_FRONT || true
              [ -n "$REMOVE_BACK" ] && docker rm -f $REMOVE_BACK || true
              if docker compose version >/dev/null 2>&1; then
                docker compose -p "$COMPOSE_PROJECT_NAME" up -d --build --no-deps frontend backend
              else
                docker-compose -p "$COMPOSE_PROJECT_NAME" up -d --build --no-deps frontend backend
              fi
            elif [ -n "$FRONT_CHANGED" ]; then
              [ -n "$REMOVE_FRONT" ] && docker rm -f $REMOVE_FRONT || true
              if docker compose version >/dev/null 2>&1; then
                docker compose -p "$COMPOSE_PROJECT_NAME" up -d --build --no-deps frontend
              else
                docker-compose -p "$COMPOSE_PROJECT_NAME" up -d --build --no-deps frontend
              fi
            elif [ -n "$BACK_CHANGED" ]; then
              [ -n "$REMOVE_BACK" ] && docker rm -f $REMOVE_BACK || true
              if docker compose version >/dev/null 2>&1; then
                docker compose -p "$COMPOSE_PROJECT_NAME" up -d --build --no-deps backend
              else
                docker-compose -p "$COMPOSE_PROJECT_NAME" up -d --build --no-deps backend
              fi
            else
              echo "Nenhuma mudanca relevante para build detectada."
            fi
            REMOVE_FRONT=$(docker ps -a --format '{{.ID}} {{.Names}}' | awk '/ab0-frontend/ {print $1}')
            REMOVE_BACK=$(docker ps -a --format '{{.ID}} {{.Names}}' | awk '/ab0-backend/ {print $1}')
            [ -n "$REMOVE_FRONT" ] && docker rm -f $REMOVE_FRONT || true
            [ -n "$REMOVE_BACK" ] && docker rm -f $REMOVE_BACK || true
            if docker compose version >/dev/null 2>&1; then
              docker compose -p "$COMPOSE_PROJECT_NAME" up -d --no-deps frontend backend
            else
              docker-compose -p "$COMPOSE_PROJECT_NAME" up -d --no-deps frontend backend
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^ab0-redis$'; then
              if docker compose version >/dev/null 2>&1; then
                docker compose -p "$COMPOSE_PROJECT_NAME" up -d redis
              else
                docker-compose -p "$COMPOSE_PROJECT_NAME" up -d redis
              fi
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^ab0-postgres$'; then
              if docker compose version >/dev/null 2>&1; then
                docker compose -p "$COMPOSE_PROJECT_NAME" up -d postgres
              else
                docker-compose -p "$COMPOSE_PROJECT_NAME" up -d postgres
              fi
            fi
