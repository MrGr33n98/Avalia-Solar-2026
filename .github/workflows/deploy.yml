name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60m
          command_timeout: 60m
          # REMOVIDO: keepalive_interval (causava erro)
          script: |
            set -e

            echo "--- 1. Navegando para a pasta do projeto ---"
            cd ~/Avalia-Solar-2026

            echo "--- 2. Atualizando código fonte (Git) ---"
            # Garante permissões seguras no git
            git config --global --add safe.directory ~/Avalia-Solar-2026
            
            # Atualiza o repositório
            git fetch origin main
            git reset --hard origin/main

            echo "--- 3. Deploy com Docker ---"
            # Otimizações para o build
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # O docker-compose vai ler automaticamente o arquivo .env da pasta
            # para preencher as variáveis como RAILS_MASTER_KEY
            
            echo "--- 3.1 Derrubando containers antigos (safety check) ---"
            docker-compose down --remove-orphans || true

            echo "--- 3.2 Subindo novos containers ---"
            docker-compose up -d --build

            echo "--- 4. Limpeza de imagens ---"
            docker image prune -f

            echo "✅ Deploy finalizado com sucesso!"