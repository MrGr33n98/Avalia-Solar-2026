name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite disparar o deploy manualmente para testes

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Alterado para usar KEY em vez de PASSWORD conforme sua lista de secrets
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          port: ${{ secrets.SSH_PORT }}
          # Aumenta o timeout da conexão e do comando para evitar o erro anterior
          timeout: 60m
          command_timeout: 60m
          # Mantém a conexão ativa enquanto o Next.js processa a build em silêncio
          keepalive_interval: 30s 
          script: |
            set -e
            # Certifique-se de que o caminho da pasta está correto no seu servidor
            cd ~/Avalia-Solar-2026
            
            echo "--- Atualizando código fonte ---"
            git fetch --depth=1 origin main
            git checkout -f main
            git reset --hard origin/main
            
            echo "--- Verificando mudanças e iniciando build ---"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Detecta o que mudou para otimizar o tempo de build no servidor
            CHANGED_FILES=$(git diff --name-only HEAD~1..HEAD)
            FRONT_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^(AB0-1-front/|package.json|package-lock.json)" || true)
            BACK_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^(AB0-1-back/|Gemfile|Gemfile\.lock)" || true)
            
            if [ -n "$FRONT_CHANGED" ] && [ -n "$BACK_CHANGED" ]; then
              docker-compose up -d --build frontend backend
            elif [ -n "$FRONT_CHANGED" ]; then
              docker-compose up -d --build frontend
            elif [ -n "$BACK_CHANGED" ]; then
              docker-compose up -d --build backend
            else
              echo "Nenhuma mudança de código detectada. Apenas reiniciando serviços."
              docker-compose up -d
            fi
            
            echo "--- Limpeza de imagens antigas para liberar espaço ---"
            docker image prune -f
            
            echo "✅ Deploy finalizado com sucesso!"