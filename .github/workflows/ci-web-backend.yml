name: CI — Web & Backend (Quality & Tests)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Suite de testes para executar"
        required: true
        default: "full"
        type: choice
        options:
          - "full"
          - "critical"
          - "docs_only"
  push:
    branches: ["main", "develop", "staging"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: enterprise-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  RUBY_VERSION: "3.2.2"
  NODE_VERSION: "20.x"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # Evaluates change impact and determines test scopes (docs_only, css_canary, rspec, e2e)
  change-impact-shadow:
    name: Change Impact & Risk Classification
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      css_canary_eligible: ${{ steps.impact.outputs.css_canary_eligible }}
      docs_only: ${{ steps.impact.outputs.docs_only }}
      risk: ${{ steps.impact.outputs.risk }}
      release_scope: ${{ steps.impact.outputs.release_scope }}
      fallback: ${{ steps.impact.outputs.fallback }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Contract tests for impact classifier
        run: python3 .github/scripts/test_classify_change_impact.py
      - name: Contract tests for documentation validator
        run: python3 .github/scripts/test_validate_docs_pr.py
      - name: Regression manual documentation dispatch (trusted whole-branch diff)
        run: python3 .github/scripts/test_docs_manual_dispatch.py
      - name: Contract tests for CI timing metrics
        run: python3 .github/scripts/test_analyze_ci_runs.py
      - name: Resolve changed paths and publish advisory summary
        id: impact
        env:
          TEST_SUITE_INPUT: ${{ inputs.test_suite || 'full' }}
        run: bash .github/scripts/resolve-change-impact.sh

  docs-validation:
    name: Documentation Quality & Integrity Gate
    needs: change-impact-shadow
    if: >-
      ${{ !cancelled() &&
          needs.change-impact-shadow.result == 'success' &&
          ((github.event_name == 'pull_request' && needs.change-impact-shadow.outputs.docs_only == 'true') ||
           (github.event_name == 'workflow_dispatch' && inputs.test_suite == 'docs_only')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate documentation changes and links
        env:
          TEST_SUITE_INPUT: ${{ inputs.test_suite || 'full' }}
        run: bash .github/scripts/validate-docs-pr.sh

  fast-feedback:
    name: Code Quality & Security Scan
    needs: change-impact-shadow
    if: >-
      ${{ !cancelled() &&
          needs.change-impact-shadow.result == 'success' &&
          !(github.event_name == 'pull_request' && needs.change-impact-shadow.outputs.docs_only == 'true') &&
          !(github.event_name == 'workflow_dispatch' && inputs.test_suite == 'docs_only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate production CI gate contract
        run: bash .github/scripts/test-verify-release-ci.sh

      - name: Validate RSpec scope classifier
        run: bash .github/scripts/test-classify-rspec-scope.sh

      - name: Validate CSS canary required gate contracts
        run: bash .github/scripts/test-verify-smart-ci-gate.sh

      # Ruby Setup
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      # Node Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: AB0-1-front/package-lock.json

      # Backend Checks
      - name: Rubocop
        working-directory: ./AB0-1-back
        continue-on-error: true
        run: bundle exec rubocop --parallel || true

      - name: Brakeman (Security)
        working-directory: ./AB0-1-back
        run: |
          gem install brakeman
          bundle exec brakeman -q -w2

      - name: Bundler Audit
        working-directory: ./AB0-1-back
        continue-on-error: true
        run: |
          gem install bundler-audit
          bundle-audit check --update || true

      # Frontend Checks
      - name: Install Frontend Deps
        working-directory: ./AB0-1-front
        run: npm ci

      - name: Frontend Lint & Audit
        working-directory: ./AB0-1-front
        run: |
          npm run lint -- --quiet || true
          npm audit --audit-level=high || true

      # Global Secrets Scan
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  backend-tests:
    name: Backend Unit Tests (RSpec)
    needs: [change-impact-shadow, fast-feedback]
    if: >-
      ${{ !cancelled() &&
          needs.fast-feedback.result == 'success' &&
          !(github.event_name == 'pull_request' && needs.change-impact-shadow.outputs.docs_only == 'true') &&
          !(github.event_name == 'workflow_dispatch' && inputs.test_suite == 'docs_only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      rspec-scope: ${{ steps.rspec-scope.outputs.scope }}
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine RSpec scope
        id: rspec-scope
        run: bash .github/scripts/resolve-rspec-scope.sh

      - name: Setup Ruby
        if: steps.rspec-scope.outputs.scope != 'none'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Run RSpec
        if: steps.rspec-scope.outputs.scope != 'none'
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
          RSPEC_SCOPE: ${{ steps.rspec-scope.outputs.scope }}
          RSPEC_FILES: ${{ steps.rspec-scope.outputs.specs }}
        run: |
          bundle exec rails db:create db:schema:load db:migrate
          bundle exec rails zeitwerk:check
          bundle exec rails runner script/schema_contract_check.rb
          bundle exec rails runner 'Group.limit(1).load; GroupMembership.limit(1).load; puts "GROUPS_SMOKE_OK"'
          RAILS_ENV=production DATABASE_URL=postgresql://postgres:postgres@localhost:5432/avaliasolar_test SECRET_KEY_BASE=ci-only-secret-key-base-not-for-production bundle exec rails runner 'puts "PRODUCTION_BOOT_OK"'
          if [[ "$RSPEC_SCOPE" == "full" ]]; then
            bundle exec rspec
          else
            read -r -a spec_files <<< "$RSPEC_FILES"
            bundle exec rspec "${spec_files[@]}"
          fi

      - name: Run W0 SEO backend contracts
        if: steps.rspec-scope.outputs.scope != 'none'
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: bundle exec rspec spec/models/company_spec.rb spec/requests/api/v1/sitemaps_spec.rb

      - name: Report RSpec skipped for unrelated changes
        if: steps.rspec-scope.outputs.scope == 'none'
        run: echo "RSpec completo dispensado; alterações sem impacto no backend. E2E e contratos críticos seguem obrigatórios."

  ranking-performance-gate:
    name: Ranking Performance Contract
    if: >-
      ${{ !cancelled() &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.test_suite == 'full' || inputs.test_suite == ''))) &&
          needs.fast-feedback.result == 'success' }}
    needs: fast-feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Prepare ranking test database
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rails db:create db:schema:load db:migrate

      - name: Diagnose ranking service core examples
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        continue-on-error: true
        run: bundle exec rspec spec/services/company_dashboard/ranking_service_spec.rb:31 spec/services/company_dashboard/ranking_service_spec.rb:41 spec/services/company_dashboard/ranking_service_spec.rb:47

      - name: Diagnose ranking service state and filters
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        continue-on-error: true
        run: bundle exec rspec spec/services/company_dashboard/ranking_service_spec.rb:55 spec/services/company_dashboard/ranking_service_spec.rb:65 spec/services/company_dashboard/ranking_service_spec.rb:72 spec/services/company_dashboard/ranking_service_spec.rb:81 spec/services/company_dashboard/ranking_service_spec.rb:90

      - name: Diagnose ranking service quadrant and history
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        continue-on-error: true
        run: bundle exec rspec spec/services/company_dashboard/ranking_service_spec.rb:107 spec/services/company_dashboard/ranking_service_spec.rb:114 spec/services/company_dashboard/ranking_service_spec.rb:122 spec/services/company_dashboard/ranking_service_spec.rb:131 spec/services/company_dashboard/ranking_service_spec.rb:139 spec/services/company_dashboard/ranking_service_spec.rb:149 spec/services/company_dashboard/ranking_service_spec.rb:156 spec/services/company_dashboard/ranking_service_spec.rb:165

      - name: Run complete ranking service specs
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: bundle exec rspec spec/services/company_dashboard/ranking_service_spec.rb

      - name: Run ranking snapshot writer specs
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: bundle exec rspec spec/services/company_dashboard/ranking_snapshot_writer_spec.rb

      - name: Run ranking benchmark specs
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: bundle exec rspec spec/services/company_dashboard/ranking_benchmark_service_spec.rb

      - name: Run ranking request and policy specs
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rspec \
            spec/requests/api/v1/company_dashboard_analytics_ranking_spec.rb \
            spec/requests/api/v1/company_dashboard_feature_gating_spec.rb

      - name: Run trust score contract spec
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: bundle exec rspec spec/models/company_trust_score_spec.rb

  ranking-frontend-gate:
    name: Ranking Performance Frontend Contract
    needs: [change-impact-shadow, fast-feedback]
    if: >-
      ${{ !cancelled() &&
          needs.fast-feedback.result == 'success' &&
          !(github.event_name == 'pull_request' && needs.change-impact-shadow.outputs.docs_only == 'true') &&
          !(github.event_name == 'workflow_dispatch' && inputs.test_suite == 'docs_only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Ranking Performance tests
        run: npm test -- RankingPerformanceTab --runInBand
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Run Navbar and registration ticker tests
        run: npm test -- CompanyRegistrationTicker Navbar.test --runInBand
      - name: Run Related Companies compact layout regression
        run: npm test -- --runInBand RelatedCompaniesTable RelatedCompaniesCarousel
      - name: Run Buyer Proposals Carbon UI regression
        run: >-
          npm test -- --runInBand
          components/reviewer/proposals/ProjectJourneyStepper.spec.tsx
          __tests__/components/ProposalStatusSummary.test.tsx
          __tests__/components/ProposalCompactCard.test.tsx
      - name: Lint Ranking Performance files
        run: npx eslint app/dashboard/components/RankingPerformanceTab.tsx app/dashboard/components/ranking app/dashboard/components/MagicQuadrant.tsx

  category-seo-contract-gate:
    name: Category Discovery & SEO Contract Gate
    needs: [change-impact-shadow, fast-feedback]
    if: >-
      ${{ !cancelled() &&
          needs.fast-feedback.result == 'success' &&
          !(github.event_name == 'pull_request' && needs.change-impact-shadow.outputs.docs_only == 'true') &&
          !(github.event_name == 'workflow_dispatch' && inputs.test_suite == 'docs_only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Category SEO & Discovery Jest Suite
        run: |
          npx jest \
            lib/server/category-discovery/__tests__/get-public-category.test.ts \
            lib/seo/__tests__/category-metadata.test.ts \
            lib/seo/__tests__/category-sitemap.test.ts \
            lib/seo/__tests__/facets-and-pagination.test.tsx \
            lib/seo/__tests__/local-and-locale-policy.test.ts \
            lib/seo/__tests__/revalidate-route.test.ts \
            __tests__/categories/CategoryEditorialAndSchema.test.tsx \
            __tests__/sitemap.test.ts \
            __tests__/local-page-quality.test.ts \
            __tests__/company-api-error-semantics.spec.ts \
            --runInBand --no-coverage
      - name: Run Home Category Ribbon unit regression
        run: npx jest __tests__/components/home/HomeCategoryRibbon.test.tsx --runInBand --no-coverage
      - name: Typecheck Frontend
        run: npm run typecheck
      - name: Lint Category Discovery & SEO Modules (Strict)
        run: |
          npx eslint \
            lib/server/category-discovery/get-public-category.ts \
            lib/seo/category-metadata.ts \
            lib/seo/category-schema.ts \
            lib/seo/sitemap-builders.ts \
            lib/seo/facets-policy.ts \
            lib/seo/locale-policy.ts \
            lib/seo/search-params.ts \
            app/robots.ts \
            app/api/revalidate/route.ts \
            "app/sitemaps/[section]/sitemap.xml/route.ts" \
            "app/categories/[slug]/page.tsx" \
            "app/categories/[slug]/CategoryPageServer.tsx" \
            "app/categories/[slug]/CategoryPageClientV2.tsx" \
            components/categories/CategoryEditorialSection.tsx \
            components/categories/CategoryNichesCarousel.tsx \
            components/categories/CategoryCompaniesTable.tsx

  seo-w0-regression-gate:
    name: SEO W0 Regression Gate
    needs: [change-impact-shadow, fast-feedback]
    if: >-
      ${{ !cancelled() &&
          needs.fast-feedback.result == 'success' &&
          !(github.event_name == 'pull_request' && needs.change-impact-shadow.outputs.docs_only == 'true') &&
          !(github.event_name == 'workflow_dispatch' && inputs.test_suite == 'docs_only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./AB0-1-front
        run: npm ci

      - name: Run W0 frontend contracts
        working-directory: ./AB0-1-front
        run: >-
          npx jest --runInBand --no-coverage
          __tests__/sitemap.test.ts
          __tests__/local-page-quality.test.ts
          __tests__/company-api-error-semantics.spec.ts

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Run W0 backend contracts
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rails db:create db:schema:load db:migrate
          bundle exec rspec spec/models/company_spec.rb spec/requests/api/v1/sitemaps_spec.rb

  e2e-tests:
    name: E2E Playwright Tests
    needs:
      [
        change-impact-shadow,
        fast-feedback,
        backend-tests,
        ranking-performance-gate,
        ranking-frontend-gate,
        category-seo-contract-gate,
      ]
    if: >-
      ${{ !cancelled() &&
          needs.fast-feedback.result == 'success' &&
          needs.backend-tests.result == 'success' &&
          needs.ranking-frontend-gate.result == 'success' &&
          needs.category-seo-contract-gate.result == 'success' &&
          (needs.ranking-performance-gate.result == 'success' ||
           needs.ranking-performance-gate.result == 'skipped') &&
          !(github.event_name == 'pull_request' &&
            needs.change-impact-shadow.outputs.docs_only == 'true') &&
          !(github.event_name == 'workflow_dispatch' &&
            inputs.test_suite == 'docs_only') &&
          !(github.event_name == 'pull_request' &&
            vars.SMART_CI_ENABLED == 'true' &&
            needs.change-impact-shadow.result == 'success' &&
            needs.change-impact-shadow.outputs.css_canary_eligible == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.test_suite == 'full' || inputs.test_suite == ''))) && 120 || 30 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx for shared Docker cache
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Spin up Local Environment (Docker Compose)
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || 'test@avaliasolar.com.br' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || 'Password123' }}
        run: |
          set -Eeuo pipefail
          export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export BETTER_AUTH_SECRET="$(openssl rand -hex 32)"
          if ! docker compose -f infra/docker/docker-compose.test.yml up --build --wait --wait-timeout 300 -d; then
            docker compose -f infra/docker/docker-compose.test.yml ps -a || true
            frontend_id="$(docker compose -f infra/docker/docker-compose.test.yml ps -q frontend || true)"
            if [ -n "$frontend_id" ]; then
              docker inspect --format='Frontend health details: {{json .State.Health}}' "$frontend_id" || true
            fi
            docker compose -f infra/docker/docker-compose.test.yml logs --tail=200 || true
            exit 1
          fi
          docker compose -f infra/docker/docker-compose.test.yml ps

      - name: Setup Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: AB0-1-front/package-lock.json

      - name: Install Playwright Browsers
        working-directory: ./AB0-1-front
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate authenticated Banner E2E credentials
        if: github.event_name == 'push'
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::warning::E2E_USER_EMAIL ou E2E_USER_PASSWORD não configurados nos Secrets do GitHub. Usando valores mock de teste."
          fi

      - name: Run Banner Ads unit regression
        working-directory: ./AB0-1-front
        run: npm run test:banners

      - name: Run critical release E2E (Chromium)
        if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.test_suite == 'critical')
        working-directory: ./AB0-1-front
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          E2E_CATEGORY_SLUG: energia-solar
          E2E_PLACEMENT_SMOKE: true
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || 'test@avaliasolar.com.br' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || 'Password123' }}
        # Bloqueia regressões nos fluxos centrais com o conjunto E2E crítico.
        run: >-
          npx playwright test --project=chromium
          tests/e2e/auth-logout.spec.ts
          tests/e2e/financing-wizard.spec.ts
          tests/e2e/proposals-real-journey.spec.ts
          tests/e2e/company-registration-ticker-responsive.spec.ts
          tests/e2e/company-free-placeholder-responsive.spec.ts
          tests/e2e/reviewer-dashboard-viewport.spec.ts
          tests/e2e/compare-recommendations-compact.spec.ts
          tests/e2e/home-horizontal-alignment.spec.ts
          && npx playwright test --project=chromium
          tests/e2e/category-seo.spec.ts --grep @critical

      - name: Run extended E2E suite (scheduled or manual full)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.test_suite == 'full' || inputs.test_suite == ''))
        working-directory: ./AB0-1-front
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          E2E_CATEGORY_SLUG: energia-solar
          E2E_PLACEMENT_SMOKE: true
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || 'test@avaliasolar.com.br' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || 'Password123' }}
        run: npx playwright test

      - name: Collect frontend and backend logs on E2E failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.test.yml logs --no-color --tail=250 backend frontend

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: AB0-1-front/playwright-report/
          retention-days: 7

      - name: Teardown Docker Compose
        if: always()
        run: docker compose -f infra/docker/docker-compose.test.yml down -v

  build:
    name: build
    needs:
      [
        change-impact-shadow,
        docs-validation,
        fast-feedback,
        backend-tests,
        ranking-performance-gate,
        ranking-frontend-gate,
        category-seo-contract-gate,
        seo-w0-regression-gate,
        e2e-tests,
      ]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify all mandatory checks and approved skips (Smart CI Gate)
        env:
          IMPACT_RESULT: ${{ needs.change-impact-shadow.result }}
          DOCS_RESULT: ${{ needs.docs-validation.result }}
          DOCS_ONLY: ${{ needs.change-impact-shadow.outputs.docs_only }}
          FAST_RESULT: ${{ needs.fast-feedback.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          RANKING_GATE_RESULT: ${{ needs.ranking-performance-gate.result }}
          RANKING_FRONTEND_RESULT: ${{ needs.ranking-frontend-gate.result }}
          CATEGORY_RESULT: ${{ needs.category-seo-contract-gate.result }}
          SEO_W0_RESULT: ${{ needs.seo-w0-regression-gate.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          CSS_CANARY_ELIGIBLE: ${{ needs.change-impact-shadow.outputs.css_canary_eligible }}
          SMART_CI_ENABLED: ${{ vars.SMART_CI_ENABLED || 'false' }}
          TEST_SUITE_INPUT: ${{ inputs.test_suite || 'default' }}
        run: bash .github/scripts/verify-smart-ci-gate.sh
