name: CI — Web & Backend (Quality & Tests)

on:
  push:
    branches: [ "main", "develop", "staging" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: enterprise-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  RUBY_VERSION: '3.2.2'
  NODE_VERSION: '20.x'
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  fast-feedback:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ruby Setup
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      # Node Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: AB0-1-front/package-lock.json

      # Backend Checks
      - name: Rubocop
        working-directory: ./AB0-1-back
        run: bundle exec rubocop --parallel

      - name: Brakeman (Security)
        working-directory: ./AB0-1-back
        run: |
          gem install brakeman
          bundle exec brakeman -q -w2

      - name: Bundler Audit
        working-directory: ./AB0-1-back
        run: |
          gem install bundler-audit
          bundle-audit check --update

      # Frontend Checks
      - name: Install Frontend Deps
        working-directory: ./AB0-1-front
        run: npm ci

      - name: Frontend Lint & Audit
        working-directory: ./AB0-1-front
        run: |
          npm run lint -- --quiet || true
          npm audit --audit-level=high || true

      # Global Secrets Scan
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  backend-tests:
    name: Backend Unit Tests (RSpec)
    needs: fast-feedback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Run RSpec
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rails db:create db:schema:load db:migrate
          bundle exec rails zeitwerk:check
          bundle exec rails runner script/schema_contract_check.rb
          bundle exec rails runner 'Group.limit(1).load; GroupMembership.limit(1).load; puts "GROUPS_SMOKE_OK"'
          RAILS_ENV=production DATABASE_URL=postgresql://postgres:postgres@localhost:5432/avaliasolar_test SECRET_KEY_BASE=ci-only-secret-key-base-not-for-production bundle exec rails runner 'puts "PRODUCTION_BOOT_OK"'
          bundle exec rspec

  ranking-performance-gate:
    name: Ranking Performance Contract
    needs: fast-feedback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Prepare ranking test database
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rails db:create db:schema:load db:migrate

      - name: Diagnose ranking service core examples
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        continue-on-error: true
        run: bundle exec rspec spec/services/company_dashboard/ranking_service_spec.rb:31 spec/services/company_dashboard/ranking_service_spec.rb:41 spec/services/company_dashboard/ranking_service_spec.rb:47

      - name: Diagnose ranking service state and filters
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        continue-on-error: true
        run: bundle exec rspec spec/services/company_dashboard/ranking_service_spec.rb:55 spec/services/company_dashboard/ranking_service_spec.rb:65 spec/services/company_dashboard/ranking_service_spec.rb:72 spec/services/company_dashboard/ranking_service_spec.rb:81 spec/services/company_dashboard/ranking_service_spec.rb:90

      - name: Diagnose ranking service quadrant and history
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        continue-on-error: true
        run: bundle exec rspec spec/services/company_dashboard/ranking_service_spec.rb:107 spec/services/company_dashboard/ranking_service_spec.rb:114 spec/services/company_dashboard/ranking_service_spec.rb:122 spec/services/company_dashboard/ranking_service_spec.rb:131 spec/services/company_dashboard/ranking_service_spec.rb:139 spec/services/company_dashboard/ranking_service_spec.rb:149 spec/services/company_dashboard/ranking_service_spec.rb:156 spec/services/company_dashboard/ranking_service_spec.rb:165

      - name: Run complete ranking service specs
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: bundle exec rspec spec/services/company_dashboard/ranking_service_spec.rb

      - name: Run ranking snapshot writer specs
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: bundle exec rspec spec/services/company_dashboard/ranking_snapshot_writer_spec.rb

      - name: Run ranking benchmark specs
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: bundle exec rspec spec/services/company_dashboard/ranking_benchmark_service_spec.rb

      - name: Run ranking request and policy specs
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rspec \
            spec/requests/api/v1/company_dashboard_analytics_ranking_spec.rb \
            spec/requests/api/v1/company_dashboard_feature_gating_spec.rb

      - name: Run trust score contract spec
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: bundle exec rspec spec/models/company_trust_score_spec.rb

  ranking-frontend-gate:
    name: Ranking Performance Frontend Contract
    needs: fast-feedback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Ranking Performance tests
        run: npm test -- RankingPerformanceTab --runInBand
      - name: Typecheck Ranking Performance contract
        run: npm run typecheck
      - name: Lint Ranking Performance files
        run: npx eslint app/dashboard/components/RankingPerformanceTab.tsx app/dashboard/components/ranking app/dashboard/components/MagicQuadrant.tsx

  e2e-tests:
    name: E2E Playwright Tests
    needs: [fast-feedback, backend-tests, ranking-performance-gate, ranking-frontend-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Spin up Local Environment (Docker Compose)
        run: |
          docker compose -f infra/docker/docker-compose.test.yml up --build -d
          # Wait for services to be healthy
          sleep 15
          docker compose -f infra/docker/docker-compose.test.yml ps

      - name: Setup Node for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: AB0-1-front/package-lock.json

      - name: Install Playwright Browsers
        working-directory: ./AB0-1-front
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Validate authenticated Banner E2E credentials
        if: github.event_name == 'push'
        env:
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: |
          if [ -z "$E2E_USER_EMAIL" ] || [ -z "$E2E_USER_PASSWORD" ]; then
            echo "::warning::E2E_USER_EMAIL ou E2E_USER_PASSWORD não configurados nos Secrets do GitHub. Usando valores mock de teste."
          fi

      - name: Run Banner Ads unit regression
        working-directory: ./AB0-1-front
        run: npm run test:banners

      - name: Run Playwright Tests
        working-directory: ./AB0-1-front
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          E2E_CATEGORY_SLUG: energia-solar
          E2E_PLACEMENT_SMOKE: true
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL || 'test@avaliasolar.com.br' }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || 'password123' }}
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: AB0-1-front/playwright-report/
          retention-days: 7

      - name: Teardown Docker Compose
        if: always()
        run: docker compose -f infra/docker/docker-compose.test.yml down -v
