# GitHub Actions CI/CD - Backend (Rails)
# Fase 1: Testes, Security Scan e Deploy
#
# Variáveis necessárias (GitHub Secrets):
# - RAILS_MASTER_KEY
# - FLY_API_TOKEN
# - SENTRY_AUTH_TOKEN (opcional)

name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'AB0-1-back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-back/**'

env:
  RUBY_VERSION: '3.2.0'
  POSTGRES_VERSION: '14'

jobs:
  test:
    name: RSpec Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev imagemagick libvips42

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bundle exec rails db:migrate

      - name: Run RSpec
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          REDIS_URL: redis://localhost:6379/1
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          COVERAGE: true
        run: bundle exec rspec --format progress --format RspecJunitFormatter --out tmp/rspec-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspec-results
          path: AB0-1-back/tmp/rspec-results.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: AB0-1-back/coverage/

  lint:
    name: Rubocop Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Run Rubocop
        run: bundle exec rubocop --parallel --format progress

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Run Brakeman
        run: |
          bundle exec brakeman --no-pager --format json --output tmp/brakeman-report.json || true
          bundle exec brakeman --no-pager

      - name: Upload Brakeman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brakeman-report
          path: AB0-1-back/tmp/brakeman-report.json

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./AB0-1-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.staging.toml

      - name: Run migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app avaliasolar-staging --command "cd /app && rails db:migrate"

      - name: Health check
        run: |
          sleep 30
          curl -f https://staging-api.avaliasolar.com.br/health || exit 1

      - name: Rollback on failure
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl releases rollback --app avaliasolar-staging
