# GitHub Actions CI/CD - Backend (Rails)
# Fase 1: Testes, Security Scan e Deploy
#
# Variáveis necessárias (GitHub Secrets):
# - RAILS_MASTER_KEY
# - FLY_API_TOKEN
# - SENTRY_AUTH_TOKEN (opcional)

name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'AB0-1-back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-back/**'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUBY_VERSION: '3.2.9'
  POSTGRES_VERSION: '14'

jobs:
  test:
    name: RSpec Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev imagemagick libvips42

      - name: Set RAILS_MASTER_KEY (Secure)
        run: |
          if [ -z "${{ secrets.RAILS_MASTER_KEY }}" ]; then
            echo "::error::RAILS_MASTER_KEY is missing. Please set it in GitHub Secrets."
            exit 1
          fi
          echo "RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}" >> $GITHUB_ENV
          echo "::add-mask::${{ secrets.RAILS_MASTER_KEY }}"
        shell: bash

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
        run: |
          bundle exec rails db:prepare

      - name: Run RSpec Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          COVERAGE: true
        run: bundle exec rspec --format progress --format RspecJunitFormatter --out test-results/rspec.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-test-results
          path: AB0-1-back/test-results/
          retention-days: 7

  lint:
    name: Rubocop Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Run Rubocop
        run: bundle exec rubocop --parallel --format progress

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./AB0-1-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.staging.toml

      - name: Run migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app avaliasolar-staging --command "cd /app && rails db:migrate"

      - name: Health check
        run: |
          sleep 30
          bash scripts/check_staging_health.sh https://staging-api.avaliasolar.com.br

      - name: Rollback on failure
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl releases rollback --app avaliasolar-staging
