# GitHub Actions CI/CD - Backend (Rails)
# Fase 1: Testes, Security Scan e Deploy
#
# Variáveis necessárias (GitHub Secrets):
# - RAILS_MASTER_KEY
# - FLY_API_TOKEN
# - SENTRY_AUTH_TOKEN (opcional)

name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'AB0-1-back/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-back/**'

env:
  RUBY_VERSION: '3.2.9'
  POSTGRES_VERSION: '14'

jobs:
  test:
    name: RSpec Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev imagemagick libvips42

      - name: Set RAILS_MASTER_KEY (fallback to repo key)
        run: |
          if [ -n "${{ secrets.RAILS_MASTER_KEY }}" ]; then
            echo "RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}" >> $GITHUB_ENV
          elif [ -f config/master.key ]; then
            echo "RAILS_MASTER_KEY=$(cat config/master.key)" >> $GITHUB_ENV
          else
            echo "RAILS_MASTER_KEY is missing and config/master.key not found" >&2
            exit 1
          fi

      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
        run: |
          bundle exec rails db:create
          bundle exec rails db:schema:load

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
        run: bundle exec rails db:migrate

      - name: Run RSpec
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          REDIS_URL: redis://localhost:6379/1
          RAILS_ENV: test
          COVERAGE: true
        continue-on-error: true
        run: bundle exec rspec --format progress

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('AB0-1-back/coverage/**') != ''
        with:
          name: coverage
          path: AB0-1-back/coverage/

  lint:
    name: Rubocop Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Run Rubocop
        continue-on-error: true
        run: bundle exec rubocop --parallel --format progress

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./AB0-1-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Run Brakeman
        continue-on-error: true
        run: bundle exec brakeman --no-pager

      - name: Upload Brakeman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brakeman-report
          path: |
            AB0-1-back/tmp/brakeman-report.json
            AB0-1-back/tmp/brakeman-report.html
            AB0-1-back/tmp/brakeman-report.txt

      - name: Publish Brakeman summary
        if: always()
        run: |
          if [ -f "tmp/brakeman-report.txt" ]; then
            {
              echo "## Brakeman Report"
              echo ""
              tail -n 200 "tmp/brakeman-report.txt"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Brakeman Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No report found." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./AB0-1-back

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.staging.toml

      - name: Run migrations
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl ssh console --app avaliasolar-staging --command "cd /app && rails db:migrate"

      - name: Health check
        run: |
          sleep 30
          bash scripts/check_staging_health.sh https://staging-api.avaliasolar.com.br

      - name: Rollback on failure
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl releases rollback --app avaliasolar-staging
