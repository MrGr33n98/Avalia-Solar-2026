name: MCP Remote — Transport Contract Gate

on:
  pull_request:
    branches:
      - main
      - feat/mcp-02b-recovery-main-20261117
      - feat/mcp-04-oauth-resource-20261117
      - feat/mcp-05-remote-policy-20261117
      - feat/mcp-06-public-directory-20261117
      - feat/mcp-07-public-trust-comparison-20261117
      - feat/mcp-08-observability-20261117
      - test/mcp-09-adversarial-conformance-20261117
    paths:
      - 'AB0-1-back/app/controllers/api/v1/mcp/remote_transport_controller.rb'
      - 'AB0-1-back/app/controllers/api/v1/mcp/private_transport_controller.rb'
      - 'AB0-1-back/app/services/mcp/private/**'
      - 'AB0-1-back/spec/requests/api/v1/mcp/private_transport_spec.rb'
      - 'AB0-1-back/spec/requests/api/v1/mcp/c4_oauth_end_to_end_spec.rb'
      - 'AB0-1-back/spec/services/mcp/private/**'
      - '.github/scripts/mcp_private_staging_smoke.rb'
      - '.github/workflows/mcp-c4-sdk-interop-staging.yml'
      - 'scripts/mcp/interop/**'
      - 'infra/mcp-staging/**'
      - 'docs/mcp/C4_IMPLEMENTATION_AND_RELEASE_GATES.md'
      - 'AB0-1-back/app/services/mcp/modern_preview_protocol.rb'
      - 'AB0-1-back/app/services/mcp/oauth/**'
      - 'AB0-1-back/app/controllers/api/oauth/**'
      - 'AB0-1-back/app/controllers/api/v1/mcp/oauth_metadata_controller.rb'
      - 'AB0-1-back/config/initializers/doorkeeper.rb'
      - 'AB0-1-back/config/routes.rb'
      - 'AB0-1-back/db/migrate/*doorkeeper*'
      - 'AB0-1-back/spec/requests/api/v1/mcp/oauth_resource_spec.rb'
      - 'AB0-1-back/spec/requests/api/v1/mcp/oauth_doorkeeper_resource_spec.rb'
      - 'AB0-1-back/spec/requests/oauth/doorkeeper_authorization_server_spec.rb'
      - 'AB0-1-back/spec/requests/api/v1/mcp/production_activation_spec.rb'
      - 'AB0-1-back/app/services/mcp/remote_quota_policy.rb'
      - 'AB0-1-back/spec/services/mcp/remote_quota_policy_spec.rb'
      - 'AB0-1-back/spec/requests/api/v1/mcp/remote_quota_spec.rb'
      - 'AB0-1-back/app/services/mcp/public/**'
      - 'AB0-1-back/app/services/mcp/ui/**'
      - 'AB0-1-back/spec/services/mcp/public/**'
      - 'AB0-1-back/spec/services/mcp/ui/**'
      - 'AB0-1-back/spec/requests/api/v1/mcp/ui_resources_spec.rb'
      - 'packages/mcp-ui/**'
      - 'packages/ui-registry/**'
      - 'Dockerfile.backend'
      - 'AB0-1-back/spec/requests/api/v1/mcp/public_directory_execution_spec.rb'
      - 'AB0-1-back/app/services/mcp/remote_telemetry.rb'
      - 'AB0-1-back/spec/services/mcp/remote_telemetry_spec.rb'
      - 'AB0-1-back/app/services/mcp/canary/**'
      - 'AB0-1-back/spec/services/mcp/canary/**'
      - 'AB0-1-back/spec/requests/api/v1/mcp/production_canary_guard_spec.rb'
      - '.env.example'
      - 'docker-compose.yml'
      - 'AB0-1-back/app/services/mcp/public_tool_registry.rb'
      - 'AB0-1-back/spec/requests/api/v1/mcp/remote_transport_spec.rb'
      - 'AB0-1-back/spec/requests/api/v1/mcp/modern_transport_spec.rb'
      - 'AB0-1-back/spec/services/mcp/public_tool_registry_spec.rb'
      - '.github/scripts/test_mcp_c4_sdk_workflow.rb'
      - '.github/scripts/test_mcp_deployment_flags.py'
      - '.github/workflows/mcp-remote-contract-gate.yml'
      - '.github/workflows/cd-production.yml'
      - '.github/workflows/cd-mcp-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-remote-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  transport-contract:
    name: MCP Legacy + Modern Request Specs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: AB0-1-back
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
      SECRET_KEY_BASE: ci-only-mcp-transport-no-production-key
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4 # v1.207.0
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./packages/mcp-ui/package-lock.json
      - name: Build and verify MCP Interactive UI bundles
        working-directory: ./packages/mcp-ui
        run: |
          npm ci
          npm run verify
      - name: Validate agent-native UI registry (Spec 021)
        working-directory: ./packages/ui-registry
        run: |
          npm test
          npm run validate
      - name: Validate Ruby syntax
        run: |
          ruby -c app/controllers/api/v1/mcp/remote_transport_controller.rb
          ruby -c app/controllers/api/v1/mcp/private_transport_controller.rb
          ruby -c app/services/mcp/private/executor.rb
          ruby -c app/services/mcp/private/protocol.rb
          ruby -c app/services/mcp/private/telemetry.rb
          ruby -c app/services/mcp/modern_preview_protocol.rb
          ruby -c app/services/mcp/oauth/resource_authorization.rb
          ruby -c app/services/mcp/oauth/configuration.rb
          ruby -c app/controllers/api/oauth/authorizations_controller.rb
          ruby -c app/controllers/api/oauth/tokens_controller.rb
          ruby -c app/controllers/api/v1/mcp/oauth_metadata_controller.rb
          ruby -c app/services/mcp/remote_quota_policy.rb
          ruby -c app/services/mcp/public/directory_service.rb
          ruby -c app/services/mcp/public/executor.rb
          ruby -c app/services/mcp/public/input_validator.rb
          ruby -c app/services/mcp/public/cursor.rb
          ruby -c app/services/mcp/public/reputation_service.rb
          ruby -c app/services/mcp/public/comparison_service.rb
          ruby -c app/services/mcp/remote_telemetry.rb
          ruby -c app/services/mcp/canary/configuration.rb
          ruby -c app/services/mcp/canary/guard.rb
          ruby -c app/services/mcp/public/output_validator.rb
          ruby -c app/services/mcp/ui/resource_registry.rb
          ruby -c app/services/mcp/ui/text_summary_formatter.rb
          ruby -c ../.github/scripts/mcp_staging_smoke.rb
          ruby -c ../.github/scripts/mcp_private_staging_smoke.rb
          python3 -m py_compile ../scripts/mcp/interop/python_sdk_v2_smoke.py
          python3 -m py_compile ../scripts/mcp/load_test/staging_load_test.py
          node --check ../scripts/mcp/interop/typescript_sdk_v2_smoke.mjs
          ruby -ryaml -e 'YAML.load_file(ARGV.fetch(0))' ../infra/mcp-staging/compose.yml
          ruby -c app/services/mcp/public_tool_registry.rb
      - name: Validate external SDK smoke script syntax (offline, no credentials)
        run: |
          node --check ../scripts/mcp/interop/typescript_sdk_v2_smoke.mjs
          python3 -m py_compile ../scripts/mcp/interop/python_sdk_v2_smoke.py
          python3 -m py_compile ../scripts/mcp/load_test/staging_load_test.py
      - name: Enforce MCP workflow secret isolation
        run: ruby ../.github/scripts/test_mcp_c4_sdk_workflow.rb
      - name: Verify MCP Canary and UI deployment flags
        run: python3 ../.github/scripts/test_mcp_deployment_flags.py
      - name: Prepare test database
        run: bundle exec rails db:create db:schema:load db:migrate
      - name: Run legacy, modern and public tool contract specs
        run: |
          bundle exec rspec \
            spec/requests/api/v1/mcp/remote_transport_spec.rb \
            spec/requests/api/v1/mcp/modern_transport_spec.rb \
            spec/requests/api/v1/mcp/oauth_resource_spec.rb \
            spec/requests/api/v1/mcp/oauth_doorkeeper_resource_spec.rb \
            spec/requests/oauth/doorkeeper_authorization_server_spec.rb \
            spec/requests/api/v1/mcp/production_activation_spec.rb \
            spec/requests/api/v1/mcp/remote_quota_spec.rb \
            spec/requests/api/v1/mcp/private_transport_spec.rb \
            spec/requests/api/v1/mcp/c4_oauth_end_to_end_spec.rb \
            spec/services/mcp/remote_quota_policy_spec.rb \
            spec/services/mcp/public/*_spec.rb \
            spec/services/mcp/ui/*_spec.rb \
            spec/requests/api/v1/mcp/ui_resources_spec.rb \
            spec/services/mcp/remote_telemetry_spec.rb \
            spec/services/mcp/private/telemetry_spec.rb \
            spec/services/mcp/canary/*_spec.rb \
            spec/services/mcp/observability_spec.rb \
            spec/security/secrets_hygiene_spec.rb \
            spec/requests/api/v1/mcp/public_directory_execution_spec.rb \
            spec/requests/api/v1/mcp/production_canary_guard_spec.rb \
            spec/services/mcp/public_tool_registry_spec.rb

  ui-browser-contract:
    name: MCP UI — Browser and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/mcp-ui
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./packages/mcp-ui/package-lock.json
      - run: npm ci
      - run: npm run build && npm run build:playground
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
