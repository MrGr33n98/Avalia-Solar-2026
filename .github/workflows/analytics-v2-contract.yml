name: Analytics V2 — Contract Verification

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'AB0-1-front/lib/analytics/**'
      - 'AB0-1-front/__tests__/lib/analytics/**'
      - 'AB0-1-front/__tests__/lib/utm.test.ts'
      - '.github/workflows/analytics-v2-contract.yml'

permissions:
  contents: read

jobs:
  analytics-contract:
    name: Analytics V2 — Frontend Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Testar integridade e atribuição
        run: npx jest --runInBand --runTestsByPath __tests__/lib/analytics/measurement-v2.test.ts __tests__/lib/utm.test.ts
      - name: Verificar TypeScript
        run: npm run typecheck
