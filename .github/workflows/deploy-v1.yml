name: Enterprise Deploy - Avalia Solar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BUILD DO BACKEND ---
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          # 👇 O Docker entra na pasta do Rails para compilar
          context: ./AB0-1-back
          # 👇 Ele usa o Dockerfile que está na raiz (ou dentro da pasta se você moveu)
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:latest
          build-args: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
          no-cache: true

      # --- BUILD DO FRONTEND ---
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./AB0-1-front
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:latest
          no-cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            cd ~/Avalia-Solar-2026
            
            echo "🔐 Login no registry..."
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            echo "🛑 Parando containers..."
            docker-compose down
            
            echo "🗑️ Removendo imagens antigas..."
            docker rmi ghcr.io/traes/avalia-solar-2026-backend:latest || true
            docker rmi ghcr.io/traes/avalia-solar-2026-frontend:latest || true
            
            echo "🗑️ Limpando cache Docker..."
            docker system prune -af --volumes
            
            echo "📥 Pulling novas imagens (forçando download)..."
            docker-compose pull --ignore-pull-failures
            
            echo "🚀 Iniciando containers com force-recreate..."
            # Tenta docker compose v2, se falhar usa docker-compose v1
            docker compose up -d --force-recreate --remove-orphans 2>/dev/null || \
            docker-compose up -d --force-recreate --remove-orphans
            
            echo "🗑️ Limpando imagens antigas..."
            docker image prune -af
            
            echo "⏳ Aguardando 10 segundos..."
            sleep 10
            
            echo "📋 Verificando logs do frontend..."
            docker logs --tail 30 avalia_frontend_prod || true
            
            echo "✅ Deploy finalizado com sucesso!"