name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e

            echo "--- 1. Navegando para a pasta do projeto ---"
            cd ~/Avalia-Solar-2026

            echo "--- 2. Atualizando código fonte (Git) ---"
            git config --global --add safe.directory ~/Avalia-Solar-2026
            git fetch origin main
            git reset --hard origin/main

            echo "--- 3. Carregando Variáveis ---"
            if [ -f .env ]; then
              export $(grep -v '^#' .env | xargs)
            else
              echo "ERRO: .env não encontrado"
              exit 1
            fi

            echo "--- 4. Preparando Docker ---"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Derruba containers antigos para liberar RAM imediatamente
            echo "--- 4.1 Parando serviços antigos ---"
            docker-compose down --remove-orphans || true
            
            # Limpeza preventiva
            docker system prune -a -f --volumes || true

            # ESTRATÉGIA DE SOBREVIVÊNCIA DE RAM:
            # Constrói um de cada vez para não explodir a memória do servidor
            
            echo "--- 4.2 Construindo Backend (Rails) ---"
            # Passamos a chave explicitamente para garantir
            docker-compose build --no-cache --build-arg RAILS_MASTER_KEY=${RAILS_MASTER_KEY} backend
            
            echo "--- 4.3 Construindo Frontend (Next.js) ---"
            docker-compose build --no-cache frontend

            echo "--- 4.4 Iniciando Serviços ---"
            docker-compose up -d

            echo "✅ Deploy finalizado com sucesso!"