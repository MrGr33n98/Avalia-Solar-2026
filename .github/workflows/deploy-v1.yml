name: Enterprise Deploy - Avalia Solar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # --- ESTRATÉGIA DE PARALELISMO ---
    strategy:
      matrix:
        component: [backend, frontend]
    
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-${{ matrix.component }}:latest
          build-args: |
            ${{ matrix.component == 'backend' && format('RAILS_MASTER_KEY={0}', secrets.RAILS_MASTER_KEY) || '' }}
            ${{ matrix.component == 'frontend' && format('NEXT_PUBLIC_API_URL={0}', vars.NEXT_PUBLIC_API_URL) || '' }}
            ${{ matrix.component == 'frontend' && format('NEXT_PUBLIC_API_BASE_URL={0}', vars.NEXT_PUBLIC_API_BASE_URL) || '' }}
            ${{ matrix.component == 'frontend' && format('NEXT_PUBLIC_SITE_URL={0}', vars.NEXT_PUBLIC_SITE_URL) || '' }}
          # --- ATIVAÇÃO DE CACHE INTELIGENTE ---
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ~/Avalia-Solar-2026

            on_error() {
              code=$?
              echo -e "\n❌ Deploy falhou (exit=${code}). Dumping estado do Docker..." >&2
              docker compose ps || true
              docker compose logs --tail 200 db redis backend frontend || true
              exit ${code}
            }
            trap on_error ERR

            echo "📥 Atualizando código local..."
            # Evita falha do deploy quando há alterações locais no servidor (ex.: docker-compose.yml)
            git fetch origin main
            git reset --hard origin/main

            echo "🔑 Login no Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🚚 Pulling novas imagens..."
            docker compose pull backend frontend

            echo "🧱 Garantindo dependências (db/redis) ativas..."
            docker compose up -d db redis

            echo "⏳ Aguardando db/redis ficarem healthy..."
            for i in $(seq 1 200); do
              db_cid=$(docker compose ps -q db 2>/dev/null || true)
              redis_cid=$(docker compose ps -q redis 2>/dev/null || true)

              db_status=$( [ -n "$db_cid" ] && docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$db_cid" 2>/dev/null || echo starting )
              redis_status=$( [ -n "$redis_cid" ] && docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$redis_cid" 2>/dev/null || echo starting )

              if [ "$db_status" = "healthy" ] && [ "$redis_status" = "healthy" ]; then
                echo "✅ db/redis healthy"
                break
              fi
              printf 'db=%s redis=%s (tentativa %s/200)\n' "$db_status" "$redis_status" "$i"
              sleep 3
            done
            if [ "${db_status:-starting}" != "healthy" ] || [ "${redis_status:-starting}" != "healthy" ]; then
              echo "❌ db/redis não ficaram healthy a tempo" >&2
              docker compose ps || true
              docker compose logs --tail 200 db redis || true
              exit 1
            fi

            echo "🔄 Reiniciando apenas o que mudou..."
            # --no-deps evita reiniciar o Postgres e Redis sem necessidade
            docker compose up -d --no-deps backend frontend

            echo "⏳ Aguardando backend ficar healthy..."
            for i in $(seq 1 240); do
              be_cid=$(docker compose ps -q backend 2>/dev/null || true)
              be_status=$( [ -n "$be_cid" ] && docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$be_cid" 2>/dev/null || echo starting )
              if [ "$be_status" = "healthy" ]; then
                echo "✅ backend healthy"
                break
              fi
              # Tentativa de checar endpoint de saúde diretamente
              if [ $((i % 20)) -eq 0 ] && [ -n "$be_cid" ]; then
                docker exec -t "$be_cid" sh -lc "curl -fsS http://localhost:3001/health" && echo "↪️ health endpoint OK" && break || true
              fi
              printf 'backend=%s (tentativa %s/240)\n' "$be_status" "$i"
              sleep 3
            done
            if [ "${be_status:-starting}" != "healthy" ]; then
              echo "❌ backend não ficou healthy a tempo" >&2
              docker compose logs --tail 200 backend || true
              exit 1
            fi

            echo "🗄️ Migrações de banco..."
            docker compose exec -T backend bundle exec rails db:migrate

            echo "🧹 Limpeza e Finalização..."
            docker image prune -f
            echo "✅ Deploy finalizado com sucesso!"