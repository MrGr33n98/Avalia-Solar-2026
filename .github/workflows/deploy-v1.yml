name: Enterprise Deploy - Avalia Solar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Specific job permissions
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Server Actions key
        if: matrix.component == 'frontend'
        run: |
          if [ -z "${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}" ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY é obrigatório mas não foi definido."
            exit 1
          fi

      - name: Validate Rails master key
        if: matrix.component == 'backend'
        run: |
          if [ -z "${{ secrets.RAILS_MASTER_KEY }}" ]; then
            echo "::error::RAILS_MASTER_KEY é obrigatório mas não foi definido no GitHub Secrets."
            exit 1
          fi

      - name: Validate Better Auth secret
        if: matrix.component == 'frontend'
        run: |
          if [ -z "${{ secrets.BETTER_AUTH_SECRET }}" ]; then
            echo "::error::BETTER_AUTH_SECRET é obrigatório mas não foi definido."
            exit 1
          fi

      - name: Build and Push Backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:latest
          secrets: |
            rails_master_key=${{ secrets.RAILS_MASTER_KEY }}
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache
            type=gha,scope=backend
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache,mode=max
            type=gha,scope=backend,mode=max

      - name: Build and Push Frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.avaliasolar.com.br/api/v1' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.avaliasolar.com.br' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://avaliasolar.com.br' }}
            NEXT_PUBLIC_ENABLE_ANALYTICS=${{ vars.NEXT_PUBLIC_ENABLE_ANALYTICS || 'true' }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID || 'GTM-5RV76ZKR' }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL || 'https://avaliasolar.com.br' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
            NEXT_PUBLIC_LINKEDIN_CLIENT_ID=${{ vars.NEXT_PUBLIC_LINKEDIN_CLIENT_ID || '' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || '' }}
          secrets: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache
            type=gha,scope=frontend
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache,mode=max
            type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.SSH_HOST }}" ] && MISSING+=("SSH_HOST")
          [ -z "${{ secrets.SSH_USER }}" ] && MISSING+=("SSH_USER")
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && MISSING+=("SSH_PRIVATE_KEY")
          
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::As seguintes secrets estao faltando: ${MISSING[*]}"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        env:
          DOCKER_USER: ${{ github.actor }}
          DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 15m
          script_stop: false
          envs: DOCKER_USER,DOCKER_TOKEN
          script: |
            set -ex
            cd ~/Avalia-Solar-2026

            echo "?? Atualizando codigo local..."
            git fetch origin main
            git reset --hard origin/main

            echo "?? Login no GitHub Container Registry (ghcr.io)..."
            if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_TOKEN" ]; then
              echo "!! ERRO: DOCKER_USER ou DOCKER_TOKEN vazios no ambiente SSH"
              exit 1
            fi
            
            echo "$DOCKER_TOKEN" | docker login ghcr.io -u "$DOCKER_USER" --password-stdin

            echo "?? Pulling novas imagens de ghcr.io..."
            docker compose pull

            echo "?? Garantindo dependencias (db/redis) ativas..."
            docker compose up -d db redis
            
            echo "?? Aguardando db/redis ficarem healthy..."
            sleep 5

            echo "?? Reiniciando apenas o que mudou..."
            docker compose up -d backend frontend

            echo "?? Aguardando backend ficar healthy..."
            for i in $(seq 1 30); do
              if docker compose ps backend | grep -q "healthy"; then
                echo "?? backend healthy"
                break
              fi
              echo "Aguardando backend... ($i/30)"
              sleep 2
            done

            echo "?? Migracoes de banco..."
            docker compose exec -T backend bundle exec rails db:migrate

            echo "?? Verificando se ha dados no banco..."
            # Captura robusta com marcador para evitar confusao com logs
            HAS_DATA=$(docker compose exec -T backend bundle exec rails runner "puts \"MARKER_COUNT:#{Company.count}\"" 2>/dev/null | grep "MARKER_COUNT:" | tail -n 1 | tr -cd '0-9')
            HAS_DATA="${HAS_DATA:-0}"
            
            echo "?? Empresas encontradas: $HAS_DATA"

            # Voltamos para 'if' mas garantindo que o comando falso nao mate o script
            if [ "$HAS_DATA" = "0" ]; then
              echo "?? Banco vazio, executando seeds e restauracao..."
              docker compose exec -T backend bundle exec rails runner "require 'json'; f = Rails.root.join('companies.json'); if File.exist?(f); data = JSON.parse(File.read(f)); data.each { |d| Company.find_or_create_by(id: d['id']).update(d.except('id')) }; puts 'Restaurado'; end" || echo "?? Falha na restauracao"
              docker compose exec -T backend bundle exec rails db:seed || echo "?? Falha no seed"
            else
              echo "?? Banco ja possui dados. Ignorando seeds/restauracao."
            fi

            echo "?? Verificacao final de tabelas..."
            docker compose exec -T backend bundle exec rails runner "essential = %w[companies users]; missing = essential.reject { |t| ActiveRecord::Base.connection.table_exists?(t) }; if missing.any?; puts \"ERRO: Tabelas faltando: #{missing.join(', ')}\"; exit 1; end; puts 'Tabelas OK'"

            echo "?? Deploy finalizado com sucesso!"
            exit 0

