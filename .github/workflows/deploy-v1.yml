name: Enterprise Deploy - Avalia Solar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Specific job permissions
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io", "registry.hub.docker.com"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Server Actions key
        if: matrix.component == 'frontend'
        run: |
          if [ -z "${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}" ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY é obrigatório mas não foi definido."
            exit 1
          fi

      - name: Validate Rails master key
        if: matrix.component == 'backend'
        run: |
          if [ -z "${{ secrets.RAILS_MASTER_KEY }}" ]; then
            echo "::error::RAILS_MASTER_KEY é obrigatório mas não foi definido no GitHub Secrets."
            exit 1
          fi

      - name: Validate Better Auth secret
        if: matrix.component == 'frontend'
        run: |
          if [ -z "${{ secrets.BETTER_AUTH_SECRET }}" ]; then
            echo "::error::BETTER_AUTH_SECRET é obrigatório mas não foi definido."
            exit 1
          fi

      - name: Build and Push Backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:latest
          build-args: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
          secrets: |
            "RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}"
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache
            type=gha,scope=backend
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache,mode=max
            type=gha,scope=backend,mode=max

      - name: Build and Push Frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.avaliasolar.com.br/api/v1' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.avaliasolar.com.br' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://avaliasolar.com.br' }}
            NEXT_PUBLIC_ENABLE_ANALYTICS=${{ vars.NEXT_PUBLIC_ENABLE_ANALYTICS || 'true' }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID || 'GTM-5RV76ZKR' }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL || 'https://avaliasolar.com.br' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
            NEXT_PUBLIC_LINKEDIN_CLIENT_ID=${{ vars.NEXT_PUBLIC_LINKEDIN_CLIENT_ID || '' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || '' }}
          secrets: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache
            type=gha,scope=frontend
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache,mode=max
            type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.SSH_HOST }}" ] && MISSING+=("SSH_HOST")
          [ -z "${{ secrets.SSH_USER }}" ] && MISSING+=("SSH_USER")
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && MISSING+=("SSH_PRIVATE_KEY")
          
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::As seguintes secrets estao faltando: ${MISSING[*]}"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        env:
          DOCKER_USER: ${{ github.actor }}
          DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 15m
          script_stop: false
          envs: DOCKER_USER,DOCKER_TOKEN
          script: |
            set -ex
            cd ~/Avalia-Solar-2026

            echo "?? Padronizando Git para SSH..."
            # 1. Verificar e trocar remote para SSH se necessário (shell POSIX)
            CURRENT_REMOTE=$(git remote get-url origin 2>/dev/null || true)
            TARGET_REMOTE="git@github.com:MrGr33n98/Avalia-Solar-2026.git"

            case "$CURRENT_REMOTE" in
              https://*|http://*)
                echo "?? Detectado remote HTTP/HTTPS ($CURRENT_REMOTE). Trocando para SSH..."
                git remote set-url origin "$TARGET_REMOTE"
                ;;
              "")
                echo "!! Remote origin nao encontrado. Configurando para SSH..."
                git remote add origin "$TARGET_REMOTE"
                ;;
              *)
                echo "?? Remote ja esta configurado como SSH ou outro formato nao-HTTP(S)."
                ;;
            esac

            # 2. Garantir known_hosts para github.com
            [ -d ~/.ssh ] || mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts

            # 3. Validar acesso SSH ao GitHub
            echo "?? Validando acesso SSH ao GitHub..."
            ssh -T git@github.com 2>&1 | grep -q "successfully authenticated" || echo "!! Aviso: Autenticacao SSH pode falhar. Verifique se a Deploy Key foi adicionada corretamente."

            echo "?? Atualizando codigo local..."
            git fetch origin main
            git reset --hard origin/main

            echo "?? Ajustando limite de upload no Nginx (413 safeguard)..."
            UPLOAD_LIMIT="${NGINX_CLIENT_MAX_BODY_SIZE:-25m}"
            NGINX_LIMIT_FILE="/etc/nginx/conf.d/zz-avalia-upload-limits.conf"
            NGINX_SNIPPET="client_max_body_size ${UPLOAD_LIMIT};"

            if [ -d /etc/nginx/conf.d ]; then
              if [ "$(id -u)" = "0" ]; then
                printf "%s\n" "$NGINX_SNIPPET" > "$NGINX_LIMIT_FILE"
                if nginx -t 2>/dev/null; then
                  systemctl is-active --quiet nginx && systemctl reload nginx || echo "?? Nginx nao esta ativo, skip reload"
                  service nginx status >/dev/null 2>&1 && service nginx reload || true
                fi
              elif command -v sudo >/dev/null 2>&1; then
                printf "%s\n" "$NGINX_SNIPPET" | sudo tee "$NGINX_LIMIT_FILE" >/dev/null
                if sudo nginx -t 2>/dev/null; then
                  sudo systemctl is-active --quiet nginx && sudo systemctl reload nginx || echo "?? Nginx nao esta ativo, skip reload"
                  sudo service nginx status >/dev/null 2>&1 && sudo service nginx reload || true
                fi
              else
                echo "!! Aviso: sem permissao para atualizar Nginx automaticamente. Ajuste manual necessario: client_max_body_size ${UPLOAD_LIMIT};"
              fi
            else
              echo "?? /etc/nginx/conf.d nao encontrado neste host; pulando ajuste automatico de upload."
            fi

            echo "?? Login no GitHub Container Registry (ghcr.io)..."
            if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_TOKEN" ]; then
              echo "!! ERRO: DOCKER_USER ou DOCKER_TOKEN vazios no ambiente SSH"
              exit 1
            fi
            
            echo "$DOCKER_TOKEN" | docker login ghcr.io -u "$DOCKER_USER" --password-stdin

            echo "?? Pulling novas imagens de ghcr.io..."
            docker compose pull --quiet

            echo "?? Status dos recursos no servidor:"
            free -h
            df -h

            echo "?? Garantindo dependencias (db/redis) ativas..."
            docker compose up -d db redis
            
            echo "?? Aguardando db/redis ficarem healthy..."
            sleep 5

            echo "?? Reiniciando backend..."
            docker compose up -d backend

            BACKEND_CID=$(docker compose ps -q backend)
            if [ -z "$BACKEND_CID" ]; then
              echo "!! ERRO: nao foi possivel obter o container ID do backend"
              docker compose ps || true
              exit 1
            fi

            echo "?? Aguardando backend ficar healthy..."
            BACKEND_STATUS=""
            for i in $(seq 1 90); do
              BACKEND_STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$BACKEND_CID" 2>/dev/null || echo "missing")
              BACKEND_STATE=$(docker inspect --format='{{.State.Status}}' "$BACKEND_CID" 2>/dev/null || echo "missing")

              if [ "$BACKEND_STATUS" = "healthy" ]; then
                echo "?? backend healthy"
                break
              fi

              if [ "$BACKEND_STATE" = "exited" ] || [ "$BACKEND_STATUS" = "unhealthy" ] || [ "$BACKEND_STATUS" = "missing" ]; then
                echo "!! backend nao ficou saudavel (state=$BACKEND_STATE, health=$BACKEND_STATUS)"
                echo "?? docker compose ps backend:"
                docker compose ps backend || true
                echo "?? ultimos logs do backend:"
                docker compose logs --tail=200 backend || true
                exit 1
              fi

              echo "Aguardando backend... ($i/90) state=$BACKEND_STATE health=$BACKEND_STATUS"
              sleep 2
            done

            if [ "$BACKEND_STATUS" != "healthy" ]; then
              echo "!! Timeout aguardando backend healthy"
              docker compose ps backend || true
              docker compose logs --tail=200 backend || true
              exit 1
            fi

            echo "?? Reiniciando frontend..."
            docker compose up -d frontend

            echo "?? Migracoes de banco..."
            docker compose exec -T backend bundle exec rails db:migrate

            echo "?? Verificando se ha dados no banco..."
            # Captura robusta com marcador para evitar confusao com logs
            HAS_DATA=$(docker compose exec -T backend bundle exec rails runner "puts \"MARKER_COUNT:#{Company.count}\"" 2>/dev/null | grep "MARKER_COUNT:" | tail -n 1 | tr -cd '0-9')
            HAS_DATA="${HAS_DATA:-0}"
            
            echo "?? Empresas encontradas: $HAS_DATA"

            # Voltamos para 'if' mas garantindo que o comando falso nao mate o script
            if [ "$HAS_DATA" = "0" ]; then
              echo "?? Banco vazio, executando seeds e restauracao..."
              docker compose exec -T backend bundle exec rails runner "require 'json'; f = Rails.root.join('companies.json'); if File.exist?(f); data = JSON.parse(File.read(f)); data.each { |d| Company.find_or_create_by(id: d['id']).update(d.except('id')) }; puts 'Restaurado'; end" || echo "?? Falha na restauracao"
              docker compose exec -T backend bundle exec rails db:seed || echo "?? Falha no seed"
            else
              echo "?? Banco ja possui dados. Ignorando seeds/restauracao."
            fi

            echo "?? Verificacao final de tabelas..."
            docker compose exec -T backend bundle exec rails runner "essential = %w[companies users]; missing = essential.reject { |t| ActiveRecord::Base.connection.table_exists?(t) }; if missing.any?; puts \"ERRO: Tabelas faltando: #{missing.join(', ')}\"; exit 1; end; puts 'Tabelas OK'"

            echo "?? Deploy finalizado com sucesso!"
            exit 0

