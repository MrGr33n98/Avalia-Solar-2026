name: Enterprise Deploy - Avalia Solar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  deployments: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Specific job permissions
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Server Actions key
        if: matrix.component == 'frontend'
        run: |
          KEY="${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY || vars.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}"
          if [ -z "$KEY" ] && [ -f .env ]; then
            KEY=$(grep -E '^NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=' .env | head -n1 | cut -d= -f2- | tr -d '\r')
          fi
          if [ -z "$KEY" ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is required but not set in secrets, vars, or .env."
            exit 1
          fi
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$KEY" >> $GITHUB_ENV

      - name: Build and Push Backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:latest
          build-args: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache
            type=gha,scope=backend
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache,mode=max
            type=gha,scope=backend,mode=max

      - name: Build and Push Frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.avaliasolar.com.br/api/v1' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.avaliasolar.com.br' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://avaliasolar.com.br' }}
            NEXT_PUBLIC_ENABLE_ANALYTICS=${{ vars.NEXT_PUBLIC_ENABLE_ANALYTICS || 'true' }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID || 'GTM-5RV76ZKR' }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL || 'https://avaliasolar.com.br' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
            NEXT_PUBLIC_LINKEDIN_CLIENT_ID=${{ vars.NEXT_PUBLIC_LINKEDIN_CLIENT_ID || '' }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ env.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN || '' }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT || '' }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache
            type=gha,scope=frontend
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache,mode=max
            type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 10m
          script_stop: true
          script: |
            # Usa bash explicitamente para garantir compatibilidade com set -eo pipefail e traps
            export SHELL=/bin/bash
            set -e
            cd ~/Avalia-Solar-2026

            cleanup() {
              code=$?
              if [ $code -ne 0 ] && [ $code -ne 130 ]; then
                echo -e "\n!! Erro detectado (code=$code). coletando logs..." >&2
                docker compose ps || true
                docker compose logs --tail 100 backend db || true
              fi
            }
            trap cleanup EXIT

            echo "?? Atualizando codigo local..."
            git fetch origin main
            git reset --hard origin/main

            echo "?? Login no Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "?? Pulling novas imagens..."
            docker compose pull backend frontend

            echo "?? Garantindo dependencias (db/redis) ativas..."
            docker compose up -d db redis

            echo "?? Aguardando db/redis ficarem healthy..."
            for i in $(seq 1 200); do
              db_cid=$(docker compose ps -q db 2>/dev/null || true)
              redis_cid=$(docker compose ps -q redis 2>/dev/null || true)

              db_status=$( [ -n "$db_cid" ] && docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$db_cid" 2>/dev/null || echo starting )
              redis_status=$( [ -n "$redis_cid" ] && docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$redis_cid" 2>/dev/null || echo starting )

              if [ "$db_status" = "healthy" ] && [ "$redis_status" = "healthy" ]; then
                echo "?? db/redis healthy"
                break
              fi
              printf 'db=%s redis=%s (tentativa %s/200)\n' "$db_status" "$redis_status" "$i"
              sleep 3
            done
            if [ "${db_status:-starting}" != "healthy" ] || [ "${redis_status:-starting}" != "healthy" ]; then
              echo "!! db/redis nao ficaram healthy a tempo" >&2
              docker compose ps || true
              docker compose logs --tail 200 db redis || true
              exit 1
            fi

            echo "?? Reiniciando apenas o que mudou..."
            docker compose up -d --no-deps backend frontend

            echo "?? Aguardando backend ficar healthy..."
            for i in $(seq 1 240); do
              be_cid=$(docker compose ps -q backend 2>/dev/null || true)
              be_status=$( [ -n "$be_cid" ] && docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}' "$be_cid" 2>/dev/null || echo starting )
              if [ "$be_status" = "healthy" ]; then
                echo "?? backend healthy"
                break
              fi
              if [ $((i % 20)) -eq 0 ] && [ -n "$be_cid" ]; then
                docker exec -t "$be_cid" sh -lc "curl -fsS -H 'Host: api.avaliasolar.com.br' http://localhost:3001/health" && echo "?? health endpoint OK" && break || true
              fi
              printf 'backend=%s (tentativa %s/240)\n' "$be_status" "$i"
              sleep 3
            done
            if [ "${be_status:-starting}" != "healthy" ]; then
              echo "!! backend nao ficou healthy a tempo" >&2
              docker compose logs --tail 200 backend || true
              exit 1
            fi

            echo "?? Migracoes de banco..."

            echo "?? Criando extensao PostgreSQL btree_gin..."
            docker compose exec -T db psql -U postgres -d ab0 -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" 2>/dev/null || true

            echo "?? Configurando ambiente Rails..."
            docker compose exec -T backend bundle exec rails db:environment:set RAILS_ENV=production

            echo "?? Executando migracoes..."
            if ! docker compose exec -T backend bundle exec rails db:migrate; then
              echo "?? Migrate falhou, mas NAO vamos recriar o banco (preservar dados)"
              echo "?? Tentando criar banco se nao existir..."
              docker compose exec -T backend bundle exec rails db:create || true
              docker compose exec -T backend bundle exec rails db:migrate || true
            fi
            
            echo "?? Verificando se ha dados no banco..."
            # Desativa temporariamente exit-on-error para evitar que falhas de logs ou pipes matem o deploy
            set +e
            HAS_DATA_RAW=$(docker compose exec -T backend bundle exec rails runner "puts \"DATA_COUNT:#{Company.count}\"" 2>/dev/null)
            HAS_DATA=$(echo "$HAS_DATA_RAW" | grep "DATA_COUNT:" | tail -n 1 | cut -d: -f2 | tr -cd '0-9')
            HAS_DATA="${HAS_DATA:-0}"
            set -e
            
            echo "?? Empresas encontradas: $HAS_DATA"

            if [ "$HAS_DATA" -eq "0" ]; then
              echo "?? Banco vazio, restaurando dados do backup..."
              
              # Importar empresas do backup
              docker compose exec -T backend bundle exec rails runner "
                require 'json'
                
                # Ler arquivo JSON com empresas
                backup_file = Rails.root.join('companies.json')
                if File.exist?(backup_file)
                  puts 'Carregando empresas do backup...'
                  companies_data = JSON.parse(File.read(backup_file))
                  
                  companies_data.each do |company_data|
                    company = Company.find_or_initialize_by(id: company_data['id'])
                    company.assign_attributes(
                      name: company_data['name'],
                      description: company_data['description'],
                      website: company_data['website'],
                      phone: company_data['phone'],
                      address: company_data['address'],
                      state: company_data['state'],
                      city: company_data['city'],
                      rating_avg: company_data['rating_avg'],
                      rating_count: company_data['rating_count'],
                      status: company_data['status'],
                      featured: company_data['featured'],
                      verified: company_data['verified']
                    )
                    company.save
                  end
                  
                  puts \"#{Company.count} empresas restauradas do backup\"
                else
                  puts 'Arquivo de backup nao encontrado, populando com seeds...'
                end
              " || echo "Falha ao restaurar backup, continuando..."
              
              # Seeds padrão se não houver backup
              docker compose exec -T backend bundle exec rails db:seed || true
            else
              echo "?? Banco ja contem dados ($HAS_DATA empresas), pulando restauracao"
            fi

            echo "?? Verificacao essencial..."
            docker compose exec -T backend bundle exec rails runner "
              tables = ActiveRecord::Base.connection.tables
              essential = %w[schema_migrations categories companies users]
              missing = essential.reject { |t| tables.include?(t) }
              if missing.any?
                puts 'ERRO: faltam tabelas: ' + missing.join(', ')
                exit 1
              else
                puts 'Banco OK. Total de tabelas: ' + tables.count.to_s
              end
            " || { echo "?? Falha na verificacao essencial do banco"; exit 1; }
            
            echo "?? Aguardando frontend inicializar..."
            for i in $(seq 1 60); do
              fe_cid=$(docker compose ps -q frontend 2>/dev/null || true)
              if [ -n "$fe_cid" ]; then
                fe_status=$(docker inspect -f '{{.State.Status}}' "$fe_cid" 2>/dev/null || echo "starting")
                if [ "$fe_status" = "running" ]; then
                  # Testar se o Next.js esta respondendo
                  if docker exec "$fe_cid" curl -fsS http://localhost:3000/healthz >/dev/null 2>&1; then
                    echo "?? Frontend healthy e respondendo!"
                    break
                  fi
                fi
              fi
              printf 'frontend=%s (tentativa %s/60)\n' "$fe_status" "$i"
              sleep 2
            done
            
            echo "?? Frontend inicializado!"
            
            echo "?? Limpeza e Finalizacao..."
            docker image prune -f
            docker system prune -f --volumes || true

            echo "?? Deploy finalizado com sucesso!"

