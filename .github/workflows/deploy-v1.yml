name: Enterprise Deploy - Avalia Solar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Transforma o nome do repo em minúsculo para evitar erro no Docker Registry
      - name: Lowercase Repository Name
        id: repo_name
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BUILD DO BACKEND ---
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          # Alterado para a subpasta onde o código Rails reside para encontrar 'config/application.rb'
          context: ./AB0-1-back
          # Caminho do arquivo Dockerfile relativo à raiz do repositório
          file: ./AB0-1-back/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:latest
          build-args: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}

      # --- BUILD DO FRONTEND ---
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          # Contexto na subpasta onde o código Next.js reside
          context: ./AB0-1-front
          # Caminho do Dockerfile relativo à raiz do repositório
          file: ./AB0-1-front/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/Avalia-Solar-2026
            
            # Login automático no Registro do GitHub
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 1. Baixa as imagens novas
            docker-compose pull

            # 2. Garante a remoção de containers antigos para evitar conflitos
            docker-compose down || true

            # 3. Sobe o sistema forçando a atualização total e removendo órfãos
            docker-compose up -d --force-recreate --remove-orphans

            # 4. Limpeza de imagens antigas para economizar espaço em disco
            docker image prune -f
            
            echo "✅ Deploy da Avalia Solar finalizado com sucesso!"