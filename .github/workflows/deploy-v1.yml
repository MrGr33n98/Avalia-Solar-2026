name: Enterprise Deploy - Avalia Solar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- BUILD DO BACKEND ---
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          # Alterado para a raiz para que o Dockerfile encontre as pastas AB0-1-back/...
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:latest
          build-args: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
          no-cache: true

      # --- BUILD DO FRONTEND ---
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          # Alterado para a raiz
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:latest
          no-cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/Avalia-Solar-2026
            
            echo " Atualizando repositório local na VM..."
            git pull origin main
            
            echo " Login no registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo " Pulling novas imagens..."
            docker compose pull
            
            echo " Reiniciando serviços..."
            docker compose up -d --force-recreate --remove-orphans
            
            echo " Rodando migrações de banco..."
            docker exec ab0-backend bundle exec rails db:migrate
            
            echo " Limpando imagens antigas..."
            docker image prune -af
            
            echo " Verificando logs rápidos..."
            docker compose logs --tail 20 backend frontend
            
            echo " Deploy finalizado com sucesso!"