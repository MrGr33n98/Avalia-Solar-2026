name: Enterprise Deploy - Avalia Solar

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # --- ESTRATÉGIA DE PARALELISMO ---
    strategy:
      matrix:
        component: [backend, frontend]
    
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ steps.repo_name.outputs.repository }}-${{ matrix.component }}:latest
          build-args: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
          # --- ATIVAÇÃO DE CACHE INTELIGENTE ---
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd ~/Avalia-Solar-2026

            on_error() {
              code=$?
              echo -e "\n❌ Deploy falhou (exit=${code}). Dumping estado do Docker..." >&2
              docker compose ps || true
              docker compose logs --tail 200 db redis backend frontend || true
              exit ${code}
            }
            trap on_error ERR

            echo "📥 Atualizando código local..."
            git pull origin main

            echo "🔑 Login no Registry..."
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "🚚 Pulling novas imagens..."
            docker compose pull backend frontend

            echo "🧱 Garantindo dependências (db/redis) ativas..."
            docker compose up -d db redis

            echo "⏳ Aguardando db/redis ficarem healthy..."
            for i in $(seq 1 60); do
              db_status=$(docker inspect -f '{{.State.Health.Status}}' ab0-postgres 2>/dev/null || echo starting)
              redis_status=$(docker inspect -f '{{.State.Health.Status}}' ab0-redis 2>/dev/null || echo starting)
              if [ "$db_status" = "healthy" ] && [ "$redis_status" = "healthy" ]; then
                echo "✅ db/redis healthy"
                break
              fi
              echo "db=$db_status redis=$redis_status (tentativa $i/60)"; sleep 2
            done
            if [ "${db_status:-starting}" != "healthy" ] || [ "${redis_status:-starting}" != "healthy" ]; then
              echo "❌ db/redis não ficaram healthy a tempo" >&2
              docker logs --tail 200 ab0-postgres || true
              docker logs --tail 200 ab0-redis || true
              exit 1
            fi

            echo "🔄 Reiniciando apenas o que mudou..."
            # --no-deps evita reiniciar o Postgres e Redis sem necessidade
            docker compose up -d --no-deps backend frontend

            echo "⏳ Aguardando backend ficar healthy..."
            for i in $(seq 1 60); do
              be_status=$(docker inspect -f '{{.State.Health.Status}}' ab0-backend 2>/dev/null || echo starting)
              if [ "$be_status" = "healthy" ]; then
                echo "✅ backend healthy"
                break
              fi
              echo "backend=$be_status (tentativa $i/60)"; sleep 2
            done
            if [ "${be_status:-starting}" != "healthy" ]; then
              echo "❌ backend não ficou healthy a tempo" >&2
              docker logs --tail 200 ab0-backend || true
              exit 1
            fi

            echo "🗄️ Migrações de banco..."
            docker compose exec -T backend bundle exec rails db:migrate

            echo "🧹 Limpeza e Finalização..."
            docker image prune -f
            echo "✅ Deploy finalizado com sucesso!"