name: Enterprise Deploy - Avalia Solar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Never interrupt a remote deploy halfway through a container replacement.
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_SHA: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Specific job permissions
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io", "registry.hub.docker.com"]

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose GHCR backend image target
        if: matrix.component == 'backend'
        run: |
          echo "Backend image: ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:latest"
          echo "Backend cache: ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          docker buildx version

      - name: Resolve Server Actions key
        if: matrix.component == 'frontend'
        run: |
          if [ -z "${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}" ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY é obrigatório mas não foi definido."
            exit 1
          fi

      - name: Validate Rails master key
        if: matrix.component == 'backend'
        run: |
          if [ -z "${{ secrets.RAILS_MASTER_KEY }}" ]; then
            echo "::error::RAILS_MASTER_KEY é obrigatório mas não foi definido no GitHub Secrets."
            exit 1
          fi

      - name: Validate Better Auth secret
        if: matrix.component == 'frontend'
        run: |
          if [ -z "${{ secrets.BETTER_AUTH_SECRET }}" ]; then
            echo "::error::BETTER_AUTH_SECRET é obrigatório mas não foi definido."
            exit 1
          fi

      - name: Build and Push Backend
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:latest
            ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:${{ env.RELEASE_SHA }}
          secrets: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache,mode=max

      - name: Build and Push Frontend
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:latest
            ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:${{ env.RELEASE_SHA }}
          build-args: |
            GIT_SHA=${{ env.RELEASE_SHA }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.avaliasolar.com.br/api/v1' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.avaliasolar.com.br' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://avaliasolar.com.br' }}
            NEXT_PUBLIC_ENABLE_ANALYTICS=${{ vars.NEXT_PUBLIC_ENABLE_ANALYTICS || 'true' }}
            NEXT_PUBLIC_ENABLE_REALTIME=${{ vars.NEXT_PUBLIC_ENABLE_REALTIME || 'false' }}
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID || 'GTM-5RV76ZKR' }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL || 'https://avaliasolar.com.br' }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '' }}
            NEXT_PUBLIC_LINKEDIN_CLIENT_ID=${{ vars.NEXT_PUBLIC_LINKEDIN_CLIENT_ID || '' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY || 'phc_oo5u9eWrjVdqdLRg1UbuiHnh5AZCp8SUxdgi68fGARd' }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://f.avaliasolar.com.br' }}
            SENTRY_ORG=${{ vars.SENTRY_ORG || '' }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || '' }}
            NEXT_PUBLIC_ENABLE_PREMIUM_PROFILE=true
          secrets: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache,mode=max

  zeitwerk-check:
    name: Zeitwerk & Boot Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back

      - name: Run Zeitwerk & Boot Checks
        working-directory: ./AB0-1-back
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
          RAILS_ENV: test
          SECRET_KEY_BASE: ci-only-secret-key-base-not-for-production
        run: |
          bundle exec rails db:create db:schema:load db:migrate
          bundle exec rails zeitwerk:check
          bundle exec rails runner script/schema_contract_check.rb
          RAILS_ENV=production DATABASE_URL=postgresql://postgres:postgres@localhost:5432/avaliasolar_test SECRET_KEY_BASE=ci-only-secret-key-base-not-for-production bundle exec rails runner 'puts "PRODUCTION_BOOT_OK"'

  deploy:
    needs: [build-and-push, zeitwerk-check]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://www.avaliasolar.com.br
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate Secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.SSH_HOST }}" ] && MISSING+=("SSH_HOST")
          [ -z "${{ secrets.SSH_USER }}" ] && MISSING+=("SSH_USER")
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && MISSING+=("SSH_PRIVATE_KEY")
          
          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::As seguintes secrets estao faltando: ${MISSING[*]}"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        env:
          DOCKER_USER: ${{ github.actor }}
          DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_SHA: ${{ env.RELEASE_SHA }}
          GH_REPOSITORY: ${{ github.repository }}
          PRODUCTION_DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR }}
          WORKER_SERVICE: ${{ vars.WORKER_SERVICE || 'worker' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 30m
          script_stop: false
          envs: DOCKER_USER,DOCKER_TOKEN,GIT_SHA,GH_REPOSITORY,PRODUCTION_DEPLOY_DIR,WORKER_SERVICE
          script: |
            set -Eeuo pipefail

            DEPLOY_DIR="${PRODUCTION_DEPLOY_DIR:-${HOME:-}/Avalia-Solar-2026}"
            REPOSITORY_URL="git@github.com:${GH_REPOSITORY}.git"
            export GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"
            echo "?? Preparando checkout em $DEPLOY_DIR..."

            if ! command -v git >/dev/null 2>&1; then
              echo "!! ERRO: git nao esta instalado na VPS"
              exit 1
            fi

            if [ ! -e "$DEPLOY_DIR" ]; then
              echo "?? Diretorio de deploy ausente; clonando repositorio publico..."
              git clone --filter=blob:none --no-checkout "$REPOSITORY_URL" "$DEPLOY_DIR"
            fi

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "!! ERRO: $DEPLOY_DIR existe, mas nao e um checkout Git valido"
              exit 1
            fi

            cd "$DEPLOY_DIR"
            git remote remove origin >/dev/null 2>&1 || true
            git remote add origin "$REPOSITORY_URL" || true

            echo "?? Atualizando codigo local..."
            git fetch origin main
            git cat-file -e "${GIT_SHA}^{commit}"
            git reset --hard "$GIT_SHA"

            # Desativar temporariamente o modo estrito para que falhas do Nginx (opcional) nao quebrem o deploy
            set +e
            set +o pipefail

            echo "?? Ajustando limite de upload no Nginx (413 safeguard)..."
            UPLOAD_LIMIT="${NGINX_CLIENT_MAX_BODY_SIZE:-25m}"
            NGINX_LIMIT_FILE="/etc/nginx/conf.d/zz-avalia-upload-limits.conf"
            NGINX_SNIPPET="client_max_body_size ${UPLOAD_LIMIT};"

            if [ -d /etc/nginx/conf.d ]; then
              if [ "$(id -u)" = "0" ]; then
                printf "%s\n" "$NGINX_SNIPPET" > "$NGINX_LIMIT_FILE"
                if nginx -t 2>/dev/null; then
                  systemctl is-active --quiet nginx && systemctl reload nginx || echo "?? Nginx nao esta ativo, skip reload"
                  service nginx status >/dev/null 2>&1 && service nginx reload || true
                fi
              elif command -v sudo >/dev/null 2>&1; then
                printf "%s\n" "$NGINX_SNIPPET" | sudo tee "$NGINX_LIMIT_FILE" >/dev/null
                if sudo nginx -t 2>/dev/null; then
                  sudo systemctl is-active --quiet nginx && sudo systemctl reload nginx || echo "?? Nginx nao esta ativo, skip reload"
                  sudo service nginx status >/dev/null 2>&1 && sudo service nginx reload || true
                fi
              else
                echo "!! Aviso: sem permissao para atualizar Nginx automaticamente. Ajuste manual necessario: client_max_body_size ${UPLOAD_LIMIT};"
              fi
            else
              echo "?? /etc/nginx/conf.d nao encontrado neste host; pulando ajuste automatico de upload."
            fi

            echo "?? Implantando vhosts no Nginx (app e npm)..."
            
            # Subdominio APP -> Rails (3001)
            APP_VHOST_SRC="${DEPLOY_DIR}/infra/nginx/app.avaliasolar.com.br.conf"
            APP_VHOST_DST="/etc/nginx/conf.d/app.avaliasolar.com.br.conf"

            # Subdominio NPM -> NPM Admin UI (81)
            NPM_VHOST_SRC="${DEPLOY_DIR}/infra/nginx/npm.avaliasolar.com.br.conf"
            NPM_VHOST_DST="/etc/nginx/conf.d/npm.avaliasolar.com.br.conf"

            deploy_vhost() {
              SRC=$1
              DST=$2
              DESC=$3
              if [ -f "$SRC" ] && [ -d /etc/nginx/conf.d ]; then
                EXISTING_LINES=0
                if [ -f "$DST" ]; then
                  if command -v sudo >/dev/null 2>&1; then
                    EXISTING_LINES=$(sudo cat "$DST" 2>/dev/null | wc -l || echo "0")
                  else
                    EXISTING_LINES=$(cat "$DST" 2>/dev/null | wc -l || echo "0")
                  fi
                fi

                # Se o arquivo existe mas não pôde ser lido (ex: permissao), pulamos por segurança
                if [ -f "$DST" ] && [ "$EXISTING_LINES" -eq 0 ]; then
                  echo "?? Vhost $DESC ja existe mas nao pôde ser lido. Pulando por seguranca."
                  return 0
                fi

                if [ "$EXISTING_LINES" -gt 30 ]; then
                  echo "?? Vhost $DESC ja possui SSL. Pulando."
                else
                  if command -v sudo >/dev/null 2>&1; then
                    sudo cp "$SRC" "$DST" || true
                  else
                    cp "$SRC" "$DST" || true
                  fi
                  echo "?? Vhost $DESC implantado."
                fi
              else
                echo "?? Vhost $DESC nao encontrado ou Nginx ausente; pulando."
              fi
              return 0
            }

            deploy_vhost "$APP_VHOST_SRC" "$APP_VHOST_DST" "app"
            deploy_vhost "$NPM_VHOST_SRC" "$NPM_VHOST_DST" "npm"

            # Reload Nginx se houver arquivos novos
            if command -v sudo >/dev/null 2>&1; then
              if sudo nginx -t; then
                sudo systemctl reload nginx 2>/dev/null || sudo service nginx reload 2>/dev/null || true
              else
                echo "!! Aviso: nginx -t falhou; mantendo configuracao atual sem reload."
              fi
            else
              if nginx -t; then
                systemctl reload nginx 2>/dev/null || service nginx reload 2>/dev/null || true
              else
                echo "!! Aviso: nginx -t falhou; mantendo configuracao atual sem reload."
              fi
            fi

            # Reativar modo estrito para o deploy principal
            set -e
            set -o pipefail

            echo "?? Login temporario no GitHub Container Registry (ghcr.io)..."
            if [ -z "$DOCKER_USER" ] || [ -z "$DOCKER_TOKEN" ]; then
              echo "!! ERRO: DOCKER_USER ou DOCKER_TOKEN vazios no ambiente SSH"
              exit 1
            fi

            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            cleanup_registry_auth() {
              docker logout ghcr.io >/dev/null 2>&1 || true
              rm -rf "$DOCKER_CONFIG"
            }
            trap cleanup_registry_auth EXIT
            printf '%s' "$DOCKER_TOKEN" | docker login ghcr.io -u "$DOCKER_USER" --password-stdin

            REPO_LOWER=$(printf '%s' "$GH_REPOSITORY" | tr '[:upper:]' '[:lower:]')
            BACKEND_REPO="ghcr.io/${REPO_LOWER}-backend"
            FRONTEND_REPO="ghcr.io/${REPO_LOWER}-frontend"
            BACKEND_IMAGE="${BACKEND_REPO}:${GIT_SHA}"
            FRONTEND_IMAGE="${FRONTEND_REPO}:${GIT_SHA}"
            BACKEND_ROLLBACK_IMAGE="${BACKEND_REPO}:rollback"
            FRONTEND_ROLLBACK_IMAGE="${FRONTEND_REPO}:rollback"
            export BACKEND_IMAGE FRONTEND_IMAGE

            echo "?? Limpando cache e imagens Docker antigas nao utilizadas para liberar espaco..."
            docker container prune -f || true
            docker image prune -a -f || true
            docker builder prune -a -f || true
            docker system prune -a -f --volumes || true

            PREVIOUS_BACKEND_ID=$(docker inspect --format='{{.Image}}' ab0-backend 2>/dev/null || true)
            PREVIOUS_FRONTEND_ID=$(docker inspect --format='{{.Image}}' ab0-frontend 2>/dev/null || true)
            [ -z "$PREVIOUS_BACKEND_ID" ] || docker image tag "$PREVIOUS_BACKEND_ID" "$BACKEND_ROLLBACK_IMAGE"
            [ -z "$PREVIOUS_FRONTEND_ID" ] || docker image tag "$PREVIOUS_FRONTEND_ID" "$FRONTEND_ROLLBACK_IMAGE"

            echo "?? Mantendo web anterior atendendo trafego ate migration e contrato passarem..."

            echo "?? Baixando imagens imutaveis, uma por vez..."
            docker pull -q "$BACKEND_IMAGE"
            docker pull -q "$FRONTEND_IMAGE"

            FREE_KB=$(df / --output=avail | tail -1 | tr -d ' ')
            if [ "${FREE_KB:-0}" -lt 1048576 ]; then
              echo "!! ERRO: menos de 1 GB livre apos o pull; abortando antes de trocar containers"
              exit 1
            fi

            echo "?? Status dos recursos no servidor:"
            free -h
            df -h

            echo "?? Removendo containers fantasma com nomes duplicados..."
            # Docker Compose v1 pode deixar containers com nomes hash-prefixados
            # que bloqueiam a criacao de novos containers com o mesmo nome base.
            for SVC_NAME in ab0-postgres ab0-redis ab0-backend ab0-frontend ab0-worker; do
              # Encontra containers cujo nome contem o nome do servico mas tem prefixo de hash
              GHOST_IDS=$(docker ps -a --filter "name=${SVC_NAME}" --format '{{.ID}} {{.Names}}' | awk -v name="${SVC_NAME}" '$2 != name {print $1}' || true)
              if [ -n "$GHOST_IDS" ]; then
                echo "  Removendo containers fantasma para ${SVC_NAME}: $GHOST_IDS"
                echo "$GHOST_IDS" | xargs -r docker rm -f 2>/dev/null || true
              fi
            done

            wait_for_health() {
              SERVICE="$1"
              MAX_ATTEMPTS="$2"
              CID=$(docker compose ps -q "$SERVICE")
              if [ -z "$CID" ]; then
                echo "!! ERRO: container de $SERVICE nao encontrado"
                return 1
              fi

              for i in $(seq 1 "$MAX_ATTEMPTS"); do
                STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CID" 2>/dev/null || echo missing)
                STATE=$(docker inspect --format='{{.State.Status}}' "$CID" 2>/dev/null || echo missing)
                if [ "$STATUS" = "healthy" ]; then
                  echo "?? $SERVICE healthy"
                  return 0
                fi
                if [ "$STATE" = "exited" ] || [ "$STATUS" = "unhealthy" ] || [ "$STATUS" = "missing" ]; then
                  docker compose logs --tail=200 "$SERVICE" || true
                  return 1
                fi
                sleep 2
              done

              echo "!! Timeout aguardando $SERVICE"
              docker compose logs --tail=200 "$SERVICE" || true
              return 1
            }

            rollback_apps() {
              echo "!! Restaurando imagens anteriores..."
              set +e
              if docker image inspect "$BACKEND_ROLLBACK_IMAGE" >/dev/null 2>&1; then
                export BACKEND_IMAGE="$BACKEND_ROLLBACK_IMAGE"
                docker compose up -d --no-deps --no-build backend
                wait_for_health backend 90
              fi
              if docker image inspect "$FRONTEND_ROLLBACK_IMAGE" >/dev/null 2>&1; then
                export FRONTEND_IMAGE="$FRONTEND_ROLLBACK_IMAGE"
                docker compose up -d --no-deps --no-build frontend
                wait_for_health frontend 90
              fi
              if docker image inspect "$BACKEND_ROLLBACK_IMAGE" >/dev/null 2>&1; then
                docker compose up -d --no-deps --no-build worker
              else
                docker start ab0-worker >/dev/null 2>&1 || true
              fi
              set -e
            }

            echo "?? Garantindo db/redis ativos sem atualizar suas imagens..."
            docker compose up -d --no-build db redis
            wait_for_health db 60
            wait_for_health redis 60

            # Variáveis do GitHub podem carregar CR/LF ou espaços residuais.
            # Sem normalização, `grep -x` falha mesmo com `worker` listado pelo Compose.
            WORKER_SERVICE="$(printf '%s' "${WORKER_SERVICE:-worker}" | tr -d '\r\n' | xargs)"
            echo "?? Verificando existencia do servico de worker: $WORKER_SERVICE"
            if ! docker compose config --services | tr -d '\r' | grep -Fqx -- "$WORKER_SERVICE"; then
              echo "!! ERRO: servico '$WORKER_SERVICE' nao existe no docker compose."
              echo "Servicos disponiveis:"
              docker compose config --services
              exit 1
            fi

            echo "?? Parando $WORKER_SERVICE para liberar memoria e drenar jobs..."
            docker compose stop -t 60 "$WORKER_SERVICE" || true

            export GIT_SHA

            echo "?? Executando migrations uma unica vez com a nova imagem..."
            if ! docker compose run --rm --no-deps backend bash -lc "bundle exec rails db:migrate --trace"; then
              echo "!! Migration falhou; mantendo a aplicacao anterior"
              echo "?? Estado da migration:"
              docker compose run --rm --no-deps backend bash -lc "bundle exec rails db:migrate:status || true"
              docker compose logs --tail=300 backend || true
              docker start ab0-worker >/dev/null 2>&1 || true
              exit 1
            fi

            echo "?? Validando contrato de schema da release..."
            if ! docker compose run --rm --no-deps backend bash -lc "bundle exec rails runner script/schema_contract_check.rb"; then
              echo "!! Contrato de schema falhou; abortando antes de atualizar o backend"
              docker compose run --rm --no-deps backend bash -lc "bundle exec rails db:migrate:status || true"
              docker compose logs --tail=300 backend || true
              docker start ab0-worker >/dev/null 2>&1 || true
              exit 1
            fi

            echo "?? Atualizando backend..."
            docker compose up -d --no-deps --no-build backend
            if ! wait_for_health backend 90; then
              rollback_apps
              exit 1
            fi

            echo "?? Atualizando frontend..."
            docker compose up -d --no-deps --no-build frontend
            if ! wait_for_health frontend 90; then
              rollback_apps
              exit 1
            fi

            echo "?? Atualizando $WORKER_SERVICE somente apos os health checks..."
            docker compose up -d --no-deps --no-build "$WORKER_SERVICE"
            docker compose logs --tail=100 "$WORKER_SERVICE" || true
            sleep 8
            WORKER_CID=$(docker compose ps -q "$WORKER_SERVICE")
            if [ -z "$WORKER_CID" ]; then
              echo "!! AVISO: container ID do $WORKER_SERVICE nao encontrado"
              docker compose ps
              docker compose logs --tail=200 "$WORKER_SERVICE" || true
            else
              STABLE=1
              for i in $(seq 1 15); do
                WORKER_STATE=$(docker inspect --format='{{.State.Status}}' "$WORKER_CID" 2>/dev/null || echo missing)
                WORKER_EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' "$WORKER_CID" 2>/dev/null || echo unknown)
                if [ "$WORKER_STATE" != "running" ]; then
                  echo "!! AVISO: $WORKER_SERVICE nao ficou em execucao (state=$WORKER_STATE, exit_code=$WORKER_EXIT_CODE)"
                  docker inspect "$WORKER_CID" --format '{{json .State}}' || true
                  docker logs --tail=200 "$WORKER_CID" || true
                  docker compose logs --tail=200 "$WORKER_SERVICE" || true
                  STABLE=0
                  break
                fi
                sleep 2
              done

              if [ "$STABLE" -ne 1 ]; then
                echo "!! AVISO: deploy concluido com backend/frontend saudaveis, mas $WORKER_SERVICE precisa de verificacao"
              fi
            fi

            mkdir -p .deploy
            printf 'GIT_SHA=%s\nBACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$GIT_SHA" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" > .deploy/current.env.tmp
            mv .deploy/current.env.tmp .deploy/current.env

            docker container prune -f >/dev/null 2>&1 || true
            docker image prune -f >/dev/null 2>&1 || true

            echo "?? Deploy finalizado com sucesso!"
