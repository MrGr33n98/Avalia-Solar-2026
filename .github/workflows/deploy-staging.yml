name: Deploy Staging — Avalia Solar

# Triggers on push to staging branch OR manual dispatch
on:
  push:
    branches: [ staging ]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual staging deploy'
        required: false
        default: 'Manual deploy requested'

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Quality Gates — must pass before any deploy
  # ─────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./AB0-1-front

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: AB0-1-front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint changed frontend files
        shell: bash
        run: |
          mapfile -d '' CHANGED_FILES < <(
            git diff --relative --name-only -z --diff-filter=ACMR HEAD^ HEAD -- \
              '*.js' '*.jsx' '*.ts' '*.tsx'
          )

          if [ ${#CHANGED_FILES[@]} -eq 0 ]; then
            echo "No changed frontend JavaScript/TypeScript files to lint."
            exit 0
          fi

          printf 'Linting changed file: %s\n' "${CHANGED_FILES[@]}"
          npx eslint --quiet "${CHANGED_FILES[@]}"

      - name: Report legacy lint debt
        continue-on-error: true
        run: npm run lint -- --quiet

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Build check
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.avaliasolar.com.br/api/v1' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.avaliasolar.com.br' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://avaliasolar.com.br' }}
          NEXT_PUBLIC_ENABLE_ANALYTICS: "false"
          NEXT_PUBLIC_GTM_ID: ""
          NEXT_PUBLIC_BETTER_AUTH_URL: "https://avaliasolar.com.br"
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'staging-placeholder-secret' }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY || 'staging-placeholder-key' }}
        run: npm run build

  # ─────────────────────────────────────────────
  # Build & Push Docker images (staging tag)
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build Docker (${{ matrix.component }})
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "repository=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose GHCR backend image target
        if: matrix.component == 'backend'
        run: |
          echo "Backend images:"
          echo "  ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:staging"
          echo "  ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:staging-${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          docker buildx version

      - name: Validate New Relic Browser variables
        if: matrix.component == 'frontend'
        env:
          NEW_RELIC_ACCOUNT_ID: ${{ vars.STAGING_NEW_RELIC_ACCOUNT_ID }}
          NEW_RELIC_APPLICATION_ID: ${{ vars.STAGING_NEW_RELIC_APPLICATION_ID }}
          NEW_RELIC_BROWSER_LICENSE_KEY: ${{ vars.STAGING_NEW_RELIC_BROWSER_LICENSE_KEY }}
          NEW_RELIC_TRUST_KEY: ${{ vars.STAGING_NEW_RELIC_TRUST_KEY }}
          NEW_RELIC_AGENT_ID: ${{ vars.STAGING_NEW_RELIC_AGENT_ID }}
        run: |
          MISSING=()
          [ -z "$NEW_RELIC_ACCOUNT_ID" ] && MISSING+=("STAGING_NEW_RELIC_ACCOUNT_ID")
          [ -z "$NEW_RELIC_APPLICATION_ID" ] && MISSING+=("STAGING_NEW_RELIC_APPLICATION_ID")
          [ -z "$NEW_RELIC_BROWSER_LICENSE_KEY" ] && MISSING+=("STAGING_NEW_RELIC_BROWSER_LICENSE_KEY")
          [ -z "$NEW_RELIC_TRUST_KEY" ] && MISSING+=("STAGING_NEW_RELIC_TRUST_KEY")
          [ -z "$NEW_RELIC_AGENT_ID" ] && MISSING+=("STAGING_NEW_RELIC_AGENT_ID")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::Missing New Relic Browser variables: ${MISSING[*]}"
            exit 1
          fi

          echo "New Relic Browser variables are configured for staging."

      - name: Build and Push Backend (staging)
        if: matrix.component == 'backend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:staging
            ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:staging-${{ github.sha }}
          secrets: |
            "RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}"
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache-staging
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-backend:cache-staging,mode=max

      - name: Build and Push Frontend (staging)
        if: matrix.component == 'frontend'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:staging
            ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:staging-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ vars.STAGING_API_URL || vars.NEXT_PUBLIC_API_URL || 'https://api.avaliasolar.com.br/api/v1' }}
            NEXT_PUBLIC_API_BASE_URL=${{ vars.STAGING_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL || 'https://api.avaliasolar.com.br' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.STAGING_SITE_URL || 'https://staging.avaliasolar.com.br' }}
            NEXT_PUBLIC_ENABLE_ANALYTICS=false
            NEXT_PUBLIC_GTM_ID=
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.STAGING_SITE_URL || 'https://staging.avaliasolar.com.br' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY || '' }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST || 'https://f.avaliasolar.com.br' }}
            NEXT_PUBLIC_NEW_RELIC_BROWSER_ENABLED=true
            NEXT_PUBLIC_NEW_RELIC_ACCOUNT_ID=${{ vars.STAGING_NEW_RELIC_ACCOUNT_ID }}
            NEXT_PUBLIC_NEW_RELIC_APPLICATION_ID=${{ vars.STAGING_NEW_RELIC_APPLICATION_ID }}
            NEXT_PUBLIC_NEW_RELIC_BROWSER_LICENSE_KEY=${{ vars.STAGING_NEW_RELIC_BROWSER_LICENSE_KEY }}
            NEXT_PUBLIC_NEW_RELIC_TRUST_KEY=${{ vars.STAGING_NEW_RELIC_TRUST_KEY }}
            NEXT_PUBLIC_NEW_RELIC_AGENT_ID=${{ vars.STAGING_NEW_RELIC_AGENT_ID }}
            NEXT_PUBLIC_NEW_RELIC_ENVIRONMENT=staging
            NEXT_PUBLIC_NEW_RELIC_RELEASE=${{ github.sha }}
          secrets: |
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
            BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache-staging
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repository }}-frontend:cache-staging,mode=max

  # ─────────────────────────────────────────────
  # Deploy to Staging server
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    environment:
      name: staging
      url: ${{ vars.STAGING_SITE_URL || 'https://staging.avaliasolar.com.br' }}

    steps:
      - name: Validate Secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.STAGING_SSH_HOST }}" ] && MISSING+=("STAGING_SSH_HOST")
          [ -z "${{ secrets.STAGING_SSH_USER }}" ] && MISSING+=("STAGING_SSH_USER")
          [ -z "${{ secrets.STAGING_SSH_KEY }}" ] && MISSING+=("STAGING_SSH_KEY")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error::Missing staging secrets: ${MISSING[*]}"
            exit 1
          fi

      - name: Deploy over SSH to Staging
        uses: appleboy/ssh-action@v1.1.0
        env:
          DOCKER_USER: ${{ github.actor }}
          DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || '22' }}
          command_timeout: 15m
          script_stop: false
          envs: DOCKER_USER,DOCKER_TOKEN,GIT_SHA,GH_REPOSITORY
          script: |
            set -Eeuo pipefail
            STAGING_DIR="${STAGING_DIR:-${HOME:-}/avaliasolar-staging}"
            COMPOSE_FILE="docker-compose.staging.yml"
            if [ ! -d "$STAGING_DIR" ] || [ ! -f "$STAGING_DIR/$COMPOSE_FILE" ]; then
              echo "ERRO: $STAGING_DIR/$COMPOSE_FILE nao esta configurado no servidor"
              exit 1
            fi
            cd "$STAGING_DIR"

            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            cleanup_registry_auth() {
              docker logout ghcr.io >/dev/null 2>&1 || true
              rm -rf "$DOCKER_CONFIG"
            }
            trap cleanup_registry_auth EXIT
            printf '%s' "$DOCKER_TOKEN" | docker login ghcr.io -u "$DOCKER_USER" --password-stdin

            REPO=$(printf '%s' "$GH_REPOSITORY" | tr '[:upper:]' '[:lower:]')
            BACKEND_IMAGE="ghcr.io/${REPO}-backend:staging-${GIT_SHA}"
            FRONTEND_IMAGE="ghcr.io/${REPO}-frontend:staging-${GIT_SHA}"
            export BACKEND_IMAGE FRONTEND_IMAGE

            docker pull "$BACKEND_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            docker compose -f "$COMPOSE_FILE" config --images | grep -Fx "$BACKEND_IMAGE" >/dev/null
            docker compose -f "$COMPOSE_FILE" config --images | grep -Fx "$FRONTEND_IMAGE" >/dev/null

            docker compose -f "$COMPOSE_FILE" up -d --no-build --wait --wait-timeout 120 db redis
            docker compose -f "$COMPOSE_FILE" stop -t 60 worker || true
            if ! docker compose -f "$COMPOSE_FILE" run --rm --no-deps --entrypoint bundle backend exec rails db:migrate; then
              docker compose -f "$COMPOSE_FILE" start worker || true
              exit 1
            fi
            docker compose -f "$COMPOSE_FILE" up -d --no-deps --no-build --wait --wait-timeout 240 backend
            docker compose -f "$COMPOSE_FILE" up -d --no-deps --no-build --wait --wait-timeout 240 frontend
            docker compose -f "$COMPOSE_FILE" up -d --no-deps --no-build worker

            echo "Staging deploy concluido para SHA: $GIT_SHA"

  # ─────────────────────────────────────────────
  # Notify on completion
  # ─────────────────────────────────────────────
  notify:
    name: Notify
    needs: [quality-gate, build-and-push, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Staging Deploy Summary
        run: |
          echo "## 🚦 Staging Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate | ${{ needs.quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`staging\` | **SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }} — ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
