name: Comparison V2 — Integration Contract Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'AB0-1-front/**'
      - 'AB0-1-back/**'
      - '.github/workflows/comparison-v2-contract-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: comparison-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-contract:
    name: Comparison Jest + TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: AB0-1-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript types
        run: npm run typecheck
      - name: Run comparison and home layout Jest specs
        run: |
          npm test -- --runInBand \
            components/CompanyComparisonModal.spec.tsx \
            components/home/HomeRails.spec.tsx \
            lib/comparison/field-normalizers.spec.ts \
            lib/comparison/comparison-storage.spec.ts \
            __tests__/components/RecommendedCompanies.test.tsx \
            __tests__/components/RecommendedCompaniesCompact.test.tsx \
            __tests__/components/ComparePwaCarbonLayout.test.tsx \
            components/compare/__tests__/compare-insights.test.ts \
            components/compare/__tests__/recommendations-grid-domain.test.ts \
            components/compare/__tests__/useCompareDiscovery.test.tsx

  backend-contract:
    name: Comparison Rails request/model specs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avaliasolar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: AB0-1-back
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avaliasolar_test
      SECRET_KEY_BASE: ci-only-comparison-v2-no-production-key
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
          working-directory: ./AB0-1-back
      - name: Check Ruby syntax
        run: |
          ruby -c app/admin/companies.rb
          ruby -c app/controllers/api/v1/companies_controller.rb
          ruby -c app/services/companies/comparison_snapshot_service.rb
      - name: Prepare test database
        run: bundle exec rails db:create db:schema:load db:migrate
      - name: Run comparison request and model specs
        run: |
          bundle exec rspec \
            spec/models/company_comparison_profile_spec.rb \
            spec/requests/api/v1/company_comparison_snapshots_spec.rb
