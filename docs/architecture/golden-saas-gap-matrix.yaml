version: "2026-09-18"
framework: "Golden SaaS Blueprint"
project: "Avalia Solar 2026"

gap_matrix:
  - domain: "Tenancy"
    capability: "Tenant Isolation"
    as_is: "CompanyMember sem TenantScope canônico"
    target: "Pool-First com CurrentTenant thread-safe e Scope universal"
    gap: "Queries em controllers e jobs sem filtro de tenant estrito"
    evidence: "app/controllers/api/v1/companies_controller.rb, app/models/company.rb"
    risk: "TENANT_ESCAPE"
    priority: "P0"
    dependency: "None"
    recommendation: "Criar concern TenantScoped e middleware CurrentTenant"

  - domain: "Entitlements"
    capability: "Entitlement Engine"
    as_is: "CompanyFeatureAccessResolver com regras estáticas"
    target: "Entitlement Engine centralizado canônico"
    gap: "Lógica de feature flags dispersa entre models e controllers"
    evidence: "app/services/company_feature_access_resolver.rb, app/models/plan_feature_catalog.rb"
    risk: "UNAUTHORIZED_FEATURE_ACCESS"
    priority: "P1"
    dependency: "Tenancy"
    recommendation: "Centralizar toda verificação canônica em EntitlementService"

  - domain: "Events"
    capability: "Transactional Outbox"
    as_is: "Enfileiramento direto via EventDispatcher"
    target: "Transactional Outbox Pattern com drenador dedicado"
    gap: "Falta de atomicidade entre commit de banco e fila Sidekiq"
    evidence: "app/services/event_dispatcher.rb, app/models/domain_event.rb"
    risk: "EVENT_LOSS_ON_FAIL"
    priority: "P1"
    dependency: "None"
    recommendation: "Criar OutboxWorker para drenar DomainEvent com garantia at-least-once"

  - domain: "Sales"
    capability: "Sales Multi-Tenancy"
    as_is: "Restrito a admins em sales_controller.rb"
    target: "Multi-tenant CRM para empresas clientes com RBAC"
    gap: "Empresas não conseguem gerenciar pipelines próprios"
    evidence: "app/controllers/api/v1/sales_controller.rb L22-26"
    risk: "FEATURE_BLOCK"
    priority: "P1"
    dependency: "Tenancy, Authorization"
    recommendation: "Implementar Pundit policies para Sales::Opportunity com escopo de Company"

  - domain: "Agents"
    capability: "Agent Control Plane & HITL"
    as_is: "MCP direto sem fila formal de aprovação"
    target: "AgentIdentity com HITL Approval Queue e limites de orçamento"
    gap: "Ausência de controle de risco para ações de escrita de IA"
    evidence: "infra/MCP_CONFIG.json, hermes-agent/"
    risk: "UNCONTROLLED_AI_ACTION"
    priority: "P1"
    dependency: "Identity, Authorization, Events"
    recommendation: "Construir ApprovalRequest model e UI de HITL no Dashboard"
