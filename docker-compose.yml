services:
  db:
    image: postgres:14
    pull_policy: if_not_present
    container_name: ab0-postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-320m}
    pids_limit: 128
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ab0-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    pull_policy: if_not_present
    container_name: ab0-redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-224m}
    pids_limit: 128
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-192mb} --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-noeviction} --maxmemory-samples 5
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - ab0-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${BACKEND_IMAGE:-ghcr.io/mrgr33n98/avalia-solar-2026-backend:latest}
    container_name: ab0-backend
    restart: unless-stopped
    mem_limit: ${BACKEND_MEMORY_LIMIT:-560m}
    pids_limit: 256
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@ab0-postgres:5432/$${POSTGRES_DB}
      GIT_SHA: ${GIT_SHA:-unknown}
      RAILS_LOG_TO_STDOUT: "true"
      DOCKER: "true"
      APP_HOST: "https://api.avaliasolar.com.br"
      GROUPS_ENABLED: ${GROUPS_ENABLED:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.avaliasolar.com.br}
      REDIS_URL: redis://ab0-redis:6379/1
      POSTGRES_HOST: ab0-postgres
      OPENSEARCH_URL: http://ab0-opensearch:9200
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      # As chaves de SPACES virão do .env via env_file
      # Fallbacks para o SDK da AWS (Active Storage)
      AWS_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY}
      AWS_REGION: ${SPACES_REGION:-nyc3}
      AWS_BUCKET: ${SPACES_BUCKET:-avalia-solar-assets}
      AWS_ENDPOINT: ${SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      # Analytics
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID}
      GA4_API_SECRET: ${GA4_API_SECRET}
      G4_ANALYTICS_ENABLED: ${G4_ANALYTICS_ENABLED:-true}
      G4_ANALYTICS_STRICT_MODE: ${G4_ANALYTICS_STRICT_MODE:-true}
    ports:
      - "3001:3001"
    networks:
      - ab0-network
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health/liveness || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${BACKEND_IMAGE:-ghcr.io/mrgr33n98/avalia-solar-2026-backend:latest}
    container_name: ab0-worker
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${WORKER_MEMORY_LIMIT:-320m}
    pids_limit: 256
    command: bundle exec sidekiq
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      GIT_SHA: ${GIT_SHA:-unknown}
      RAILS_LOG_TO_STDOUT: "true"
      DOCKER: "true"
      GROUPS_ENABLED: ${GROUPS_ENABLED:-false}
      REDIS_URL: redis://ab0-redis:6379/1
      POSTGRES_HOST: ab0-postgres
      OPENSEARCH_URL: http://ab0-opensearch:9200
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      RAILS_MAX_THREADS: ${SIDEKIQ_CONCURRENCY:-5}
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      # Fallbacks para o worker também processar imagens
      AWS_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY}
      AWS_REGION: ${SPACES_REGION:-nyc3}
      AWS_BUCKET: ${SPACES_BUCKET:-avalia-solar-assets}
      AWS_ENDPOINT: ${SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
    networks:
      - ab0-network
    volumes:
      - storage_data:/app/storage

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/mrgr33n98/avalia-solar-2026-frontend:latest}
    container_name: ab0-frontend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-280m}
    pids_limit: 256
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "https://api.avaliasolar.com.br"
      NEXT_PUBLIC_API_BASE_URL: "https://api.avaliasolar.com.br"
      NEXT_PUBLIC_SITE_URL: "https://www.avaliasolar.com.br"
      NEXT_PUBLIC_GROUPS_ENABLED: ${NEXT_PUBLIC_GROUPS_ENABLED:-false}
      API_PROXY_TARGET: "http://ab0-backend:3001"
      API_URL_INTERNAL: "http://ab0-backend:3001/api/v1"
      # Analytics
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
      NEXT_PUBLIC_ENABLE_ANALYTICS: ${NEXT_PUBLIC_ENABLE_ANALYTICS:-true}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
    ports:
      - "3000:3000"
    networks:
      - ab0-network
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 180s

