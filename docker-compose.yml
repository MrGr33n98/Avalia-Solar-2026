services:
  db:
    image: postgres:14
    container_name: ab0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ab0-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --maxmemory-samples 5
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/mrgr33n98/avalia-solar-2026-backend:latest
    container_name: ab0-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      DOCKER: "true"
      APP_HOST: "https://api.avaliasolar.com.br"
      REDIS_URL: redis://ab0-redis:6379/1
      POSTGRES_HOST: ab0-postgres
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      # As chaves de SPACES virão do .env via env_file
      # Fallbacks para o SDK da AWS (Active Storage)
      AWS_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY}
      AWS_REGION: ${SPACES_REGION:-nyc3}
      AWS_BUCKET: ${SPACES_BUCKET:-avalia-solar-assets}
      AWS_ENDPOINT: ${SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
      # Analytics
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID}
      GA4_API_SECRET: ${GA4_API_SECRET}
      G4_ANALYTICS_ENABLED: ${G4_ANALYTICS_ENABLED:-true}
      G4_ANALYTICS_STRICT_MODE: ${G4_ANALYTICS_STRICT_MODE:-true}
    ports:
      - "3001:3001"
    networks:
      - ab0-network
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health/liveness || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 180s

  worker:
    image: ghcr.io/mrgr33n98/avalia-solar-2026-backend:latest
    container_name: ab0-worker
    restart: unless-stopped
    command: bundle exec sidekiq
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      DOCKER: "true"
      REDIS_URL: redis://ab0-redis:6379/1
      POSTGRES_HOST: ab0-postgres
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      # Fallbacks para o worker também processar imagens
      AWS_ACCESS_KEY_ID: ${SPACES_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${SPACES_SECRET_ACCESS_KEY}
      AWS_REGION: ${SPACES_REGION:-nyc3}
      AWS_BUCKET: ${SPACES_BUCKET:-avalia-solar-assets}
      AWS_ENDPOINT: ${SPACES_ENDPOINT:-https://nyc3.digitaloceanspaces.com}
    networks:
      - ab0-network
    volumes:
      - storage_data:/app/storage

  frontend:
    image: ghcr.io/mrgr33n98/avalia-solar-2026-frontend:latest
    container_name: ab0-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "https://api.avaliasolar.com.br"
      NEXT_PUBLIC_API_BASE_URL: "https://api.avaliasolar.com.br"
      NEXT_PUBLIC_SITE_URL: "https://www.avaliasolar.com.br"
      API_PROXY_TARGET: "http://ab0-backend:3001"
      API_URL_INTERNAL: "http://ab0-backend:3001/api/v1"
      # Analytics
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID}
      NEXT_PUBLIC_ENABLE_ANALYTICS: ${NEXT_PUBLIC_ENABLE_ANALYTICS:-true}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
    ports:
      - "3000:3000"
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 180s

volumes:
  db_data:
  redis_data:
  storage_data:

networks:
  ab0-network:
    driver: bridge
