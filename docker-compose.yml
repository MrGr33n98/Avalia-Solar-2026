services:
  db:
    image: postgres:14
    container_name: ab0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ab0-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/mrgr33n98/avalia-solar-2026-backend:latest
    container_name: ab0-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DOCKER: "true"
      REDIS_URL: redis://ab0-redis:6379/1
      REDIS_ENABLED: "true"
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_HOST: "https://api.avaliasolar.com.br"
      SMTP_ADDRESS: ${SMTP_ADDRESS:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-avaliasolar.com.br}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL:-felipe@avaliasolar.com.br}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER}
      BREVO_SMTP_PASS: ${BREVO_SMTP_PASS}
    ports:
      - "3001:3001"
    networks:
      - ab0-network
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    image: ghcr.io/mrgr33n98/avalia-solar-2026-backend:latest
    container_name: ab0-worker
    restart: unless-stopped
    command: bundle exec sidekiq
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DOCKER: "true"
      REDIS_URL: redis://ab0-redis:6379/1
      REDIS_ENABLED: "true"
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_HOST: "https://api.avaliasolar.com.br"
      SMTP_ADDRESS: ${SMTP_ADDRESS:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-avaliasolar.com.br}
      MAILER_FROM_EMAIL: ${MAILER_FROM_EMAIL:-felipe@avaliasolar.com.br}
      BREVO_SMTP_USER: ${BREVO_SMTP_USER}
      BREVO_SMTP_PASS: ${BREVO_SMTP_PASS}
    networks:
      - ab0-network
    volumes:
      - storage_data:/app/storage

  frontend:
    image: ghcr.io/mrgr33n98/avalia-solar-2026-frontend:latest
    container_name: ab0-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "https://api.avaliasolar.com.br"
      NEXT_PUBLIC_SITE_URL: "https://avaliasolar.com.br"
      API_URL_INTERNAL: "http://backend:3001/api/v1"
    ports:
      - "3000:3000"
    command: ["node", "server.js"]
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 180s

volumes:
  db_data:
  redis_data:
  storage_data:

networks:
  ab0-network:
    driver: bridge
