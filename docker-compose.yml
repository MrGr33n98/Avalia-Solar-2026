version: "3.8"

services:
  db:
    image: postgres:14
    container_name: ab0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Não expõe para a internet, apenas local
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ab0-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # Não expõe para a internet
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./AB0-1-back
      dockerfile: Dockerfile
      # 👇 AQUI ESTÁ A CORREÇÃO MÁGICA
      # Passamos a chave como argumento para o Build
      args:
        RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    container_name: ab0-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      REDIS_URL: redis://redis:6379/0

      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      CORS_ORIGINS: "https://avaliasolar.com.br,https://www.avaliasolar.com.br"
      ADDITIONAL_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001"

      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}

    ports:
      - "3001:3001"
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./AB0-1-front
      dockerfile: Dockerfile
    container_name: ab0-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "https://api.avaliasolar.com.br"
      NEXT_PUBLIC_API_BASE_URL: "https://api.avaliasolar.com.br"
      NEXT_PUBLIC_SITE_URL: "https://avaliasolar.com.br"
      API_URL_INTERNAL: "http://backend:3001/api/v1"
    ports:
      - "3000:3000"
    command: ["node", "server.js"]
    networks:
      - ab0-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  db_data:
  redis_data:

networks:
  ab0-network:
    driver: bridge