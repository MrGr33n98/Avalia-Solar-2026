appId: com.anonymous.AvaliaSolarApp
---
- launchApp
- assertVisible: "Calculadora"
- tapOn: "Calculadora"
- assertVisible: "Calculadora Solar"

# Verifica se os valores padrões estão carregados
- assertVisible: "R$ 450.00"
- assertVisible: "Placas"
- assertVisible: "m²"

# Interage com a calculadora
- tapOn: "+"
- tapOn: "+"
- assertVisible: "R$ 550.00"

# Verifica o CTA
- assertVisible: "Comparar Propostas"
- tapOn: "Comparar Propostas"

# Deve redirecionar para a tela de exploração
- assertVisible: "Buscar por nome ou cidade..."