default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
  timeout: <%= ENV.fetch("POSTGRES_TIMEOUT") { 30000 } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { ENV.fetch("DB_HOST", "localhost") } %>
  username: <%= ENV.fetch("POSTGRES_USER") { ENV.fetch("DB_USERNAME", "postgres") } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { ENV.fetch("DB_PASSWORD", "postgres") } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { ENV.fetch("DB_PORT", 5432) } %>
  prepared_statements: true
  statement_timeout: <%= ENV.fetch("POSTGRES_STATEMENT_TIMEOUT") { 30000 } %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB") { ENV.fetch("DB_NAME", "avalia_solar_development") } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "postgres" } %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB") { ENV.fetch("DB_TEST_NAME", "avalia_solar_test") } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "postgres" } %>

production:
  <<: *default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 15 } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "password" } %>
  port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>
  database: <%= ENV['POSTGRES_DB'] %>
