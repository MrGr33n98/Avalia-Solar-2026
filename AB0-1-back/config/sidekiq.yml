# Sidekiq configuration - TASK-017
# https://github.com/sidekiq/sidekiq/wiki/Advanced-Options

:server_middleware:
  - [Sidekiq::Middleware::Server::Logging]
  - [Sidekiq::Middleware::Server::Status]
  - [Sidekiq::Middleware::Server::RetryJobs]
  - [Sidekiq::Middleware::Server::ActiveRecord]

:client_middleware:
  - [Sidekiq::Middleware::Client::Logging]

# Concurrency (number of threads)
:concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY") { 5 } %>

# Queues with priority (higher number = higher priority)
:queues:
  - [critical, 100]   # Critical jobs (payments, urgent notifications)
  - [mailers, 40]     # Email delivery
  - [default, 20]     # Default queue
  - [analytics, 15]   # Analytics processing
  - [low, 5]          # Low priority (cleanup, reports)

# Timeout for jobs (30s for standard, override per job if needed)
:timeout: 30

# Verbose logging (disable in production)
:verbose: false

# Log file
:logfile: <%= ENV.fetch("SIDEKIQ_LOGFILE") { "/dev/stdout" } %>

# PID file
:pidfile: ./tmp/pids/sidekiq.pid

# Max retries
:max_retries: 5

# Dead letter queue
:dead_max_jobs: 1000
:dead_max_age: 2592000

# Heartbeat timeout
:heartbeat_timeout: 30

# Strict argument checking
:strict: false

# Environment-specific settings
production:
  :concurrency: <%= ENV.fetch("SIDEKIQ_CONCURRENCY") { 5 } %>
  :verbose: false
  :timeout: 30
  :max_retries: 5

development:
  :concurrency: 2
  :verbose: true
  :timeout: 30

test:
  :concurrency: 1
  :verbose: false
