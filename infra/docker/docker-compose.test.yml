services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ab0_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend.test
      cache_from:
        - type=gha,scope=backend-e2e
      cache_to:
        - type=gha,scope=backend-e2e,mode=max
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ab0_test
      POSTGRES_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ab0_test
      POSTGRES_DEFAULT_DB: postgres
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      E2E_TEST_MODE: "true"
      E2E_LOGIN_THROTTLE_LIMIT: "20"
      E2E_USER_EMAIL: ${E2E_USER_EMAIL:-test@avaliasolar.com.br}
      E2E_USER_PASSWORD: ${E2E_USER_PASSWORD:-Password123}
      E2E_AUTH_EMAIL: ${E2E_AUTH_EMAIL:-auth@avaliasolar.test}
      E2E_AUTH_PASSWORD: ${E2E_AUTH_PASSWORD:-Password123}
    ports:
      - "3001:3001"
    command: >
      sh -c "
        bundle exec rails db:create db:migrate &&
        bundle exec rails runner script/prepare_e2e_user.rb &&
        bundle exec rails server -b 0.0.0.0 -p 3001
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../..
      dockerfile: Dockerfile.frontend
      secrets:
        - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        - BETTER_AUTH_SECRET
      cache_from:
        - type=gha,scope=frontend
        - type=gha,scope=frontend-e2e
      cache_to:
        - type=gha,scope=frontend-e2e,mode=max
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: test
      NEXT_PUBLIC_API_URL: http://backend:3001
      API_URL_INTERNAL: http://backend:3001
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(response => process.exit(response.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

secrets:
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:
    environment: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
  BETTER_AUTH_SECRET:
    environment: BETTER_AUTH_SECRET
