# Avalia Solar — APP subdomain vhost
# Proxies app.avaliasolar.com.br → Rails/Puma on port 3001
# SSL managed by certbot (added automatically on first run)

server {
    listen 80;
    server_name app.avaliasolar.com.br;

    # Allow large uploads (profile photos, docs)
    client_max_body_size 25m;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
      text/plain
      text/css
      text/javascript
      application/javascript
      application/json
      application/xml
      image/svg+xml
      font/woff2;

    # Static files caching
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Next.js static files
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Certbot challenge support
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        proxy_buffering    off;
    }
}
