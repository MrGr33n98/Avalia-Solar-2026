# Avalia Solar — APP subdomain vhost
# Proxies app.avaliasolar.com.br → Rails/Puma on port 3001
# SSL managed by certbot (added automatically on first run)

server {
    listen 80;
    server_name app.avaliasolar.com.br;

    # Allow large uploads (profile photos, docs)
    client_max_body_size 25m;

    # Certbot challenge support
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        proxy_buffering    off;
    }
}
