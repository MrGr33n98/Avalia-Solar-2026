# Avalia Solar — Nginx Proxy Manager redirection
# Proxies npm.avaliasolar.com.br → NPM Admin UI on port 81
# This ensures that even with a wildcard vhost, the admin UI remains accessible.

server {
    listen 80;
    server_name npm.avaliasolar.com.br;

    location / {
        proxy_pass         http://127.0.0.1:81;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
