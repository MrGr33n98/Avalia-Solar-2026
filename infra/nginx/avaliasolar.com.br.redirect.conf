# Avalia Solar — Apex Domain Canonical Redirect Vhost
# Redirects all traffic from avaliasolar.com.br (HTTP and HTTPS) to https://www.avaliasolar.com.br
# Preserves request path and query string (e.g. /f/TOKEN?source=whatsapp) with HTTP 308 Permanent Redirect.

# HTTP -> HTTPS www
server {
    listen 80;
    listen [::]:80;
    server_name avaliasolar.com.br;

    # Certbot challenge support
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://www.avaliasolar.com.br$request_uri;
    }
}

# HTTPS -> HTTPS www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name avaliasolar.com.br;

    # SSL Certificates (managed via Certbot or Nginx Proxy Manager)
    # ssl_certificate     /etc/letsencrypt/live/avaliasolar.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/avaliasolar.com.br/privkey.pem;

    # Preserve method, path, and query params using 308 Permanent Redirect
    return 308 https://www.avaliasolar.com.br$request_uri;
}
