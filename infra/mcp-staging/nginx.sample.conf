# TEMPLATE ONLY — do not copy to production Nginx or apply automatically.
# Requires manually provisioned, verified DNS+TLS and isolated staging Rails
# running on 127.0.0.1:3101. Never forward Authorization to another origin.
server {
    listen 80;
    server_name mcp-staging.avaliasolar.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mcp-staging.avaliasolar.com.br;

    ssl_certificate /etc/letsencrypt/live/mcp-staging.avaliasolar.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-staging.avaliasolar.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    # OAuth authorization codes and MCP arguments may appear in the URL/body.
    # Never enable request-body or full query-string access logging.
    access_log off;
    proxy_redirect off;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
