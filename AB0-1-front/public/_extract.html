<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Frame Extractor</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #fff;
        color: #0f172a;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        cursor: pointer;
        font-weight: 600;
      }
      button.primary {
        background: #2563eb;
        color: white;
        border-color: #2563eb;
      }
      label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      input[type="number"] {
        width: 96px;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
      }
      .progress {
        margin-top: 12px;
        width: 100%;
        height: 10px;
        background: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
      }
      .bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #2563eb, #facc15);
        transition: width 120ms ease-out;
      }
      .status {
        margin-top: 8px;
        font-size: 13px;
        color: #475569;
        font-family: ui-monospace, monospace;
      }
      canvas,
      video {
        position: absolute;
        left: -99999px;
        top: -99999px;
      }
      .summary {
        margin-top: 12px;
        font-size: 12px;
        color: #64748b;
      }
      .ok {
        color: #16a34a;
        font-weight: 600;
      }
      .err {
        color: #dc2626;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1 style="margin:0 0 12px 0;font-size:18px">Extrator de Quadros — Scroll-Driven 3D</h1>

    <div class="row">
      <label>
        Vídeo
        <select id="videoSelect"></select>
      </label>
      <label>
        Total de quadros
        <input id="totalFrames" type="number" min="10" max="300" value="120" />
      </label>
      <label>
        Qualidade WebP (0-100)
        <input id="quality" type="number" min="60" max="100" value="88" />
      </label>
      <label>
        Largura desktop
        <input id="canvasW" type="number" min="320" max="3840" value="1280" />
      </label>
      <label>
        Altura desktop
        <input id="canvasH" type="number" min="240" max="2160" value="720" />
      </label>
    </div>

    <div class="row" style="margin-top:12px">
      <label>
        <input type="checkbox" id="doMobile" checked />
        Gerar versão mobile (800px larg máx, qualidade 82)
      </label>
      <button id="start" class="primary">▶ Iniciar extração</button>
      <button id="cancel" disabled>■ Cancelar</button>
    </div>

    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="status" class="status">Pronto.</div>
    <div id="summary" class="summary"></div>

    <video id="video" playsinline muted preload="auto" crossorigin="anonymous"></video>
    <canvas id="canvas"></canvas>

    <script>
      const $ = (id) => document.getElementById(id);
      const video = $("video");
      const canvas = $("canvas");
      const ctx = canvas.getContext("2d");
      let cancelled = false;

      async function listVideos() {
        const known = [
          "/videos/O_Raio_X_e_Fluxo_de_Energi.mp4",
          "/videos/O_Conceito_O_Expositor_Flutu.mp4",
          "/videos/O_Encaixe_Perfeito_Macro_Foto.mp4",
        ];
        const sel = $("videoSelect");
        for (const src of known) {
          const opt = document.createElement("option");
          opt.value = src;
          opt.textContent = src.replace("/videos/", "");
          sel.appendChild(opt);
        }
      }
      listVideos();

      function setStatus(t, isError) {
        const el = $("status");
        el.innerHTML = isError ? `<span class="err">${t}</span>` : t;
      }
      function setPct(p) {
        $("bar").style.width = `${Math.max(0, Math.min(1, p)) * 100}%`;
      }

      async function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      async function postFrame({ index, dataUrl, kind }) {
        const res = await fetch("/save-frame", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ index, dataUrl, kind }),
        });
        if (!res.ok) {
          throw new Error(`POST /save-frame falhou: ${res.status}`);
        }
        return res.json();
      }

      function loadVideo(src) {
        return new Promise((resolve, reject) => {
          video.src = src;
          const onErr = () => reject(new Error("erro no vídeo"));
          video.addEventListener("error", onErr, { once: true });
          video.addEventListener(
            "loadedmetadata",
            () => {
              video.removeEventListener("error", onErr);
              resolve();
            },
            { once: true }
          );
        });
      }

      async function seekTo(sec) {
        return new Promise((resolve, reject) => {
          const t = Math.max(0, Math.min(sec, Math.max(0, video.duration - 0.001)));
          const onErr = () => reject(new Error("seek error"));
          video.addEventListener("error", onErr, { once: true });
          video.addEventListener(
            "seeked",
            () => {
              video.removeEventListener("error", onErr);
              resolve();
            },
            { once: true }
          );
          try {
            video.currentTime = t;
          } catch (e) {
            reject(e);
          }
        });
      }

      async function captureCurrentFrame({ width, height, type = "image/png" }) {
        canvas.width = width;
        canvas.height = height;
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        const vw = video.videoWidth || 1280;
        const vh = video.videoHeight || 720;
        const scale = Math.max(width / vw, height / vh);
        const dw = Math.round(vw * scale);
        const dh = Math.round(vh * scale);
        const dx = Math.round((width - dw) / 2);
        const dy = Math.round((height - dh) / 2);
        ctx.drawImage(video, dx, dy, dw, dh);
        return canvas.toDataURL(type, 0.92);
      }

      async function run() {
        const src = $("videoSelect").value;
        const totalFrames = Math.max(10, parseInt($("totalFrames").value || "120", 10));
        const quality = Math.max(60, Math.min(100, parseInt($("quality").value || "88", 10)));
        const W = Math.max(320, parseInt($("canvasW").value || "1280", 10));
        const H = Math.max(240, parseInt($("canvasH").value || "720", 10));
        const doMobile = $("doMobile").checked;
        cancelled = false;
        $("start").disabled = true;
        $("cancel").disabled = false;
        setPct(0);
        setStatus("Carregando vídeo…");
        const t0 = performance.now();
        try {
          await loadVideo(src);
          const dur = video.duration;
          setStatus(
            `Vídeo OK — ${video.videoWidth}×${video.videoHeight}px • ${dur.toFixed(2)}s • extraindo ${totalFrames} quadros`
          );

          let lastDesktopOk = 0;
          let lastMobileOk = 0;
          for (let i = 0; i < totalFrames; i++) {
            if (cancelled) break;
            const t = (i / Math.max(1, totalFrames - 1)) * Math.max(0, dur - 0.04);
            await seekTo(t);
            // Desktop (PNG lossless de captura → servidor equaliza + salva WebP)
            const pngUrl = await captureCurrentFrame({
              width: W,
              height: H,
              type: "image/png",
            });
            await postFrame({ index: i, dataUrl: pngUrl, kind: "desktop" });
            lastDesktopOk = i + 1;

            if (doMobile) {
              const mW = Math.min(W, 800);
              const mH = Math.round((mW / W) * H);
              const mobPng = await captureCurrentFrame({
                width: mW,
                height: mH,
                type: "image/png",
              });
              await postFrame({ index: i, dataUrl: mobPng, kind: "mobile" });
              lastMobileOk = i + 1;
            }

            setPct((i + 1) / totalFrames);
            if (i % 10 === 0 || i === totalFrames - 1) {
              setStatus(
                `Quadro ${i + 1}/${totalFrames} • ${(
                  ((i + 1) / totalFrames) *
                  100
                ).toFixed(0)}%`
              );
            }
          }
          const elapsedMs = performance.now() - t0;
          const summary = document.getElementById("summary");
          summary.innerHTML = `
            <div><span class="ok">Extração concluída.</span> Tempo total: <b>${(
              elapsedMs / 1000
            ).toFixed(1)}s</b></div>
            <div>Desktop: ${lastDesktopOk} quadros salvos. Mobile: ${lastMobileOk} quadros salvos.</div>
            <div>Parâmetros: ${W}×${H} • ${totalFrames} frames • Q=${quality} • WebP effort=4</div>
          `;
          setStatus("Concluído.");
          setPct(1);
        } catch (e) {
          console.error(e);
          setStatus(`Erro: ${e.message}`, true);
        } finally {
          $("start").disabled = false;
          $("cancel").disabled = true;
        }
      }

      $("start").addEventListener("click", () => {
        run();
      });
      $("cancel").addEventListener("click", () => {
        cancelled = true;
        setStatus("Cancelado.");
      });

      window.__autoRun = function (opts = {}) {
        if (opts.src) $("videoSelect").value = opts.src;
        if (opts.totalFrames) $("totalFrames").value = opts.totalFrames;
        if (opts.quality) $("quality").value = opts.quality;
        if (opts.W) $("canvasW").value = opts.W;
        if (opts.H) $("canvasH").value = opts.H;
        if (opts.doMobile != null) $("doMobile").checked = !!opts.doMobile;
        return run();
      };
    </script>
  </body>
</html>
