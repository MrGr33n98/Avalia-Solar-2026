<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 345" role="img" aria-labelledby="title desc">
  <title id="title">Avalia Solar logo</title>
  <desc id="desc">Símbolo direcional em cores da Avalia Solar com wordmark em azul-marinho.</desc>
  <defs>
    <linearGradient id="solarA" x1="20" y1="45" x2="275" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.52" stop-color="#F6B91A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="blueA" x1="145" y1="115" x2="275" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#081326"/>
    </linearGradient>
    <linearGradient id="greenA" x1="120" y1="165" x2="232" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
  </defs>

  <!-- Original Avalia Solar navigation/solar mark, not a copy of third-party artwork -->
  <g transform="translate(18 6)">
    <path d="M15 128 L313 5 L225 334 L174 181 Z" fill="url(#solarA)"/>
    <path d="M15 128 L174 181 L141 126 Z" fill="#F59E0B"/>
    <path d="M174 181 L225 334 L226 123 Z" fill="url(#blueA)"/>
    <path d="M141 126 L226 123 L174 181 Z" fill="#155EEF"/>
    <path d="M174 181 L226 123 L210 177 L225 334 Z" fill="#0B2A4A" opacity="0.92"/>
    <path d="M226 123 L313 5 L174 181 Z" fill="#F6B91A" opacity="0.72"/>
  </g>

  <g fill="#081326">
    <text x="390" y="215" font-family="Inter, Manrope, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="138" font-weight="720" letter-spacing="-5">Avalia Solar</text>
  </g>
</svg>
