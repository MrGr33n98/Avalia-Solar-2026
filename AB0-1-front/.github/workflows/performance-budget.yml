name: Performance Budget

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'next.config.js'
      - 'lighthouserc.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: AB0-1-front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: AB0-1-front

      - name: Build app
        run: npm run build
        working-directory: AB0-1-front

      - name: Run Lighthouse CI
        run: npm run perf:lhci
        working-directory: AB0-1-front
